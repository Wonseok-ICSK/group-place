<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 장소">
<title>우리의 장소 기록</title>
<meta name="description" content="친구들과 함께 가고 싶은 곳을 모으고, 다녀온 곳엔 각자 별점과 후기를 남기는 그룹 장소 기록">
<!-- 동료 테스트 중에는 검색에 나오지 않게. 링크 미리보기를 유지하려고 robots 메타로 제한 -->
<meta name="robots" content="noindex, nofollow">
<!-- 아이콘: 겹친 원과 장소 핀 -->
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<!-- 카톡 등으로 주소를 보낼 때 보이는 미리보기 (이미지는 전체 주소여야 함) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="우리의 장소 기록">
<meta property="og:title" content="우리의 장소 기록">
<meta property="og:description" content="가고 싶은 곳은 같이 모으고, 다녀온 곳엔 각자 별점과 후기를.">
<meta property="og:url" content="https://YOUR-SITE.example/">
<meta property="og:image" content="https://YOUR-SITE.example/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="두 원이 겹친 자리에 핀이 있는 우리의 장소 기록 마크">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- supabase-js는 버전을 고정하고(새 버전이 저절로 들어오지 않게) 파일이 바뀌지 않았는지 브라우저가 확인(integrity).
     npm 패키지에 실제로 들어 있는 파일(dist/umd/supabase.js)을 씀. .min.js는 jsDelivr가 그때그때 만들어서 내용이 바뀔 수 있음.
     올릴 때는 버전과 integrity 값을 같이 바꿈: curl -s <주소> | openssl dgst -sha384 -binary | base64 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --sunken:#EEF0EB;
  --ink:#1E2A3A; --muted:#626D7D; --line:#E1E4DE; --line-strong:#C7CCC4;
  --p1:#0E8C86; --p1-soft:#DDF1EF; --p1-ink:#0B6F6A; /* --p1-ink: 작은 글자용(흰 바탕·연한 바탕에서 4.5:1) */
  --p2:#C98208; --p2-soft:#FBEFD6;
  --heart:#E5484D; --danger:#C2362F;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --gutter:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171F; --surface:#1A212B; --sunken:#151B24;
    --ink:#E8ECF1; --muted:#9AA4B4; --line:#29323F; --line-strong:#3B4656;
    --p1:#3CC2B9; --p1-soft:#14363A; --p1-ink:#3CC2B9;
    --p2:#F0B23E; --p2-soft:#3A2D14;
    --heart:#FF6B70; --danger:#FF7A72;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p1);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--gutter)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- forms & buttons ---------- */
label.field{display:block;margin:0 0 14px}
label.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input,textarea.input{
  width:100%; font-size:16px; padding:11px 12px; border-radius:var(--r-s);
  border:1px solid var(--line-strong); background:var(--surface); outline:none;
}
.input:focus{border-color:var(--p1);box-shadow:0 0 0 3px var(--p1-soft)}
textarea.input{resize:vertical;min-height:84px;line-height:1.6}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;
  background:var(--ink);color:var(--bg);min-height:46px;
}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.small{min-height:36px;padding:7px 14px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.text-btn{background:none;border:0;padding:8px 4px;font-weight:600;color:var(--muted);font-size:14px}
.text-btn.danger{color:var(--danger)}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:0;background:transparent;
  display:inline-grid;place-items:center;color:var(--ink);
}
.icon-btn:hover{background:var(--sunken)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[disabled]{opacity:.3;cursor:default;background:transparent}
.error{color:var(--danger);font-size:14px;margin:10px 0 0;min-height:1em}

/* ---------- auth / onboarding ---------- */
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-top:40px;padding-bottom:40px}
.mark{display:flex;margin-bottom:22px}
.mark i{width:34px;height:34px;border-radius:50%;display:block}
.mark i:first-child{background:var(--p1)}
.mark i:last-child{background:var(--p2);margin-left:-12px;opacity:.92}
.gate h1{font-size:28px;line-height:1.25;letter-spacing:-0.03em;margin:0 0 8px;font-weight:800}
.gate p.lead{color:var(--muted);margin:0 0 28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px}
.switcher{display:flex;gap:6px;background:var(--sunken);padding:4px;border-radius:999px;margin-bottom:18px}
.switcher button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 0;font-weight:700;color:var(--muted)}
.switcher button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.code-box{
  font-size:30px;font-weight:800;letter-spacing:.18em;text-align:center;
  padding:16px;border-radius:var(--r-m);background:var(--p1-soft);color:var(--ink);margin:10px 0 12px;
  font-variant-numeric:tabular-nums;
}

/* ---------- main ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
/* 360px 폰에서 방 이름(30자)과 멤버 5명이 아이콘 두 개를 밀어내지 않게: 왼쪽 칸이 줄어들고 줄바꿈 */
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px 0 10px}
.top-head{flex:1;min-width:0;padding-top:2px}
.title{margin:0;font-size:22px;line-height:1.35;font-weight:800;letter-spacing:-0.03em;overflow-wrap:anywhere}
/* 방 이름 = 버튼: 누르면 방 바꾸기·새 방 시트. 끝의 ⌄가 눌러지는 것임을 알려 줌 (마지막 낱말과 같이 줄바꿈) */
.title-btn{display:inline;border:0;background:none;padding:8px 6px 8px 0;margin:0 -6px 0 0;font:inherit;color:inherit;letter-spacing:inherit;line-height:inherit;text-align:left;border-radius:6px}
.title-btn:active{opacity:.65}
.title-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.title-btn .tail{white-space:nowrap}
.title-btn svg{display:inline-block;width:20px;height:20px;margin-left:3px;vertical-align:-3px;color:var(--muted)}
.top-actions{flex:none;display:flex;align-items:center;gap:2px}
.duo{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted);margin-top:3px} /* 멤버가 5명까지라 줄바꿈 */
.duo>span{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} /* 닉네임(20자까지)이 길면 말줄임 */
.duo .nm{max-width:9em}
/* 화사한 색(노랑·연두)은 흰 바탕에서 흐려서 작은 점·동그라미에 얇은 테두리. 어두운 화면에선 짙은 직접 고른 색이 안 묻히게 밝은 테두리 */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--c,var(--line-strong));box-shadow:inset 0 0 0 1px var(--ring)}
/* 멤버 색: .mc-<색 id>(팔레트)·.mc-hex-<rrggbb>(직접 고른 색)가 정함. 값은 아래 MEMBER_COLORS·memberColorRule()에서 만듦. 나간 멤버는 .mc-none
   --c 칠하는 색(점·별·테두리·도장 테두리), --ct 글자에 쓰는 읽히는 색(밝은 화면은 더 진하게, 어두운 화면은 더 밝게), --on 그 색 위의 체크 표시 */
:root{--ring:rgb(0 0 0 / .12)}
@media (prefers-color-scheme: dark){:root{--ring:rgb(255 255 255 / .16)}}
.mc{--c-soft:var(--sunken)}
@supports (background:color-mix(in srgb,red 16%,white)){
  .mc{--c-soft:color-mix(in srgb,var(--c) 16%,var(--surface))}
  @media (prefers-color-scheme: dark){.mc{--c-soft:color-mix(in srgb,var(--c) 24%,var(--surface))}}
}
.mc-none{--c:var(--line-strong);--ct:var(--muted);--on:var(--ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{
  flex:1;border:0;background:none;padding:10px 0 11px;font-weight:700;color:var(--muted);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;font-size:15px;
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{font-weight:600;font-size:13px;margin-left:3px;font-variant-numeric:tabular-nums}
.tools{padding:12px 0 6px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .input{padding-left:38px;padding-right:44px;border-radius:999px;background:var(--surface)}
.search .input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
/* 검색어 지우기 ✕: 글자가 있을 때만 */
.search-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.search .search-clear svg{position:static;transform:none;width:16px;height:16px}
.search .input:placeholder-shown ~ .search-clear{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;margin:0 calc(var(--gutter) * -1);padding-left:var(--gutter);padding-right:var(--gutter)}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line-strong);background:transparent;border-radius:999px;
  padding:6px 13px;font-size:14px;font-weight:600;color:var(--muted)
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sort{display:flex;justify-content:flex-end;gap:2px;margin-top:4px}
.sort button{border:0;background:none;padding:4px 8px;font-size:13px;font-weight:600;color:var(--muted);border-radius:999px}
.sort button[aria-pressed="true"]{color:var(--ink);font-weight:750}

.invite{
  margin:12px 0 4px;padding:14px 16px;border-radius:var(--r-m);background:var(--p2-soft);
  display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px
}
.invite b{font-size:18px;letter-spacing:.12em;font-variant-numeric:tabular-nums}

.list{list-style:none;margin:8px 0 0;padding:0 0 120px}
.list li+li{margin-top:10px}
.place{
  display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-m);padding:14px 16px;
}
.place:active{background:var(--sunken)}
.place-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.place-name{font-size:17px;font-weight:750;letter-spacing:-0.02em;line-height:1.35}
.heart-mark{color:var(--heart);flex:none;margin-top:2px}
.heart-mark svg{width:18px;height:18px;display:block}
.meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13.5px;color:var(--muted);min-width:0}
.cat{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink)}
.addr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:flex;align-items:center;gap:8px;margin-top:12px}
.pair-tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.avg{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:3px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.avg svg{width:15px;height:15px;display:block}
.avg path{fill:var(--ink)}
.voice-tag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;
  background:var(--c-soft);font-size:13px;font-weight:650;
}
.voice-tag .nm{max-width:7em}
/* 멤버가 3명 이상인 방: 별 5개 대신 '점 + 닉네임 + ★숫자'로 줄여서 5명이 남겨도 카드가 길어지지 않게 */
.voice-tag.mini{gap:4px;padding:3px 9px 3px 7px;font-size:12.5px}
.voice-tag .sc{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-variant-numeric:tabular-nums}
.voice-tag .sc svg{width:12px;height:12px;display:block}
.voice-tag .sc path{fill:var(--c)}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{display:block}
.stars path{fill:var(--line-strong)}
.stars .h{fill:transparent}
.stars .on path,.stars .half .h{fill:var(--c)}
/* 나간 멤버('예전 멤버')의 색은 빈 별과 같은 회색이라, 칠한 별만 진한 회색으로 (별점이 보이게) */
.mc-none .stars .on path,.mc-none .stars .half .h{fill:var(--muted)}
.note-prev{margin:10px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.added{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.place-row{display:flex;gap:12px;align-items:flex-start}
.place-main{flex:1;min-width:0}
.thumb{flex:none;width:68px;height:68px;border-radius:10px;object-fit:cover;background:var(--sunken);display:block}

.empty-state{padding:48px 8px;text-align:center;color:var(--muted)}
.empty-state strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.fab{
  position:fixed;z-index:6;right:max(var(--gutter), calc(50% - 280px + var(--gutter)));
  bottom:calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 6px 18px rgba(30,42,58,.22);padding:14px 22px 14px 18px;font-size:16px
}
.fab svg{width:20px;height:20px}

/* ---------- sheets ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(15,20,28,.42);z-index:20;animation:fade .18s ease}
.sheet{
  position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
  max-height:94dvh;display:flex;flex-direction:column;background:var(--bg);
  border-radius:var(--r-l) var(--r-l) 0 0;animation:rise .24s cubic-bezier(.2,.8,.2,1);
}
@media (min-width:600px){.sheet{bottom:3vh;border-radius:var(--r-l);max-height:94vh}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 8px}
.sheet-head h2{font-size:17px;margin:0;font-weight:750}
.sheet-head .right{display:flex;align-items:center;gap:2px}
.sheet-body{overflow-y:auto;padding:4px 20px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-backdrop{animation:none}}
/* 다크 모드: 시트 바탕이 화면 바탕과 같은 색이라 뒤를 더 어둡게 하고 위쪽 테두리를 그림 */
@media (prefers-color-scheme: dark){.sheet-backdrop{background:rgba(0,0,0,.62)}.sheet{box-shadow:0 -1px 0 var(--line-strong)}}

.detail-name{font-size:26px;line-height:1.25;font-weight:800;letter-spacing:-0.03em;margin:6px 0 6px}
.detail-meta{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:14px}
.detail-meta .cat{margin-top:1px}
.map-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:700;font-size:14px;color:var(--p1);text-decoration:none}
.map-link svg{width:16px;height:16px}
.seg{display:flex;gap:6px;background:var(--sunken);padding:4px;border-radius:999px;margin:18px 0 6px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 0;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.heart-btn[aria-pressed="true"]{color:var(--heart)}
.block{margin-top:26px}
.block>h3{font-size:14px;font-weight:750;margin:0 0 10px;color:var(--ink)}
.block-row{display:flex;justify-content:flex-end;margin-top:8px}

.block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.block-head h3{font-size:14px;font-weight:750;margin:0}
.block-head .n{font-weight:600;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.block-head .text-btn{color:var(--p1)}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 16px 14px}
.visit+.visit{margin-top:10px}
.visit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}
.visit-date{font-weight:750;font-variant-numeric:tabular-nums}
.input.date{width:auto;padding:6px 10px}
.vrow{border-left:3px solid var(--c);padding:1px 0 1px 11px;margin-top:10px}
.vrow-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.voice-who{display:flex;align-items:center;gap:7px;font-weight:750;min-width:0}
.you{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--c-soft);color:var(--ink)}
.voice-body{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.voice-empty{color:var(--muted);font-size:14px;margin:2px 0 0}
.visit>.voice-empty{margin-top:8px}
.rate-input{display:flex;margin:6px 0 10px -3px}
.rs{position:relative;display:block;padding:3px}
.rs svg{width:32px;height:32px;display:block}
.rs path{fill:var(--line-strong);transition:fill .12s}
.rs .h{fill:transparent}
.rs.on path,.rs.half .h{fill:var(--c)}
.rs button{position:absolute;top:0;bottom:0;width:50%;border:0;background:none;padding:0}
.rs button:first-of-type{left:0;border-radius:8px 0 0 8px}
.rs button:last-of-type{right:0;border-radius:0 8px 8px 0}
.voice-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.voice-actions .btns{display:flex;align-items:center;gap:4px}
.by{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.danger-zone{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.danger-zone .text-btn{flex:none;white-space:nowrap}

.cat-pick{display:flex;flex-wrap:wrap;gap:6px}
.chip.add{border-style:dashed}
.new-cat{display:flex;gap:8px;margin-top:10px}
.new-cat .input{flex:1;min-width:0}
.cat-list{list-style:none;margin:0;padding:0}
.cat-list li{display:flex;align-items:center;gap:2px}
.cat-list li+li{margin-top:6px}
.cat-list .input{flex:1;min-width:0;padding:8px 10px;margin-right:4px}
.cat-list .icon-btn{width:36px;height:36px;color:var(--muted)}
.cat-list .icon-btn svg{width:18px;height:18px}

.cup-summary{margin:20px 0 6px;padding:14px 16px;border-radius:var(--r-m);background:var(--p1-soft)}
.cup-summary b{display:block;font-size:17px;letter-spacing:-0.02em}
.cup-summary span{font-size:14px;color:var(--muted)}
.cup-round{text-align:center;font-size:24px;font-weight:800;letter-spacing:-0.03em;margin:6px 0 14px}
.cup-round span{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:8px 8px 12px;text-align:left;min-width:0}
.pick:hover{border-color:var(--line-strong)}
.pick:active{background:var(--sunken)}
.pick img,.pick-ph{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--sunken);margin-bottom:4px}
.pick-ph{display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--line-strong)}
.pick-name{font-weight:750;font-size:16px;line-height:1.3;padding:0 4px;overflow-wrap:anywhere}
.pick-meta{font-size:12.5px;color:var(--muted);padding:0 4px}
.vs{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;pointer-events:none;box-shadow:0 0 0 4px var(--bg)}
.cup-foot{display:flex;justify-content:center;margin-top:10px;min-height:40px;align-items:center}
.cup-win{text-align:center}
.cup-win .photo{max-width:320px;margin:10px auto 4px}
.trophy{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--p2-soft);color:var(--p2);margin:8px 0 4px}
.trophy svg{width:30px;height:30px}
.cup-actions{display:flex;gap:8px;margin-top:20px}
.cup-actions .btn{flex:1}

/* ---------- 명예의 전당: 우승 도장, 준우승 태그, 역대 기록 ---------- */
.stamp-wrap{position:relative;display:inline-block;flex:none;line-height:0}
.stamp{--rot:-15deg;display:inline-block;width:var(--sz,52px);height:var(--sz,52px);color:var(--c);transform:rotate(var(--rot))} /* 도장 색 = 고른 멤버 색 */
.stamp svg{display:block;width:100%;height:100%;overflow:visible}
.stamp text{font-family:inherit}
.stamp .st-words{fill:var(--ct,currentColor)} /* 테두리는 화사한 칠하는 색, 글씨는 읽히는 색 */
@media (prefers-color-scheme: light){.stamp svg{mix-blend-mode:multiply}}
.stamp.fresh{animation:stamp-in .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes stamp-in{
  0%{opacity:0;transform:scale(2) rotate(calc(var(--rot) - 16deg))}
  55%{opacity:1;transform:scale(.88) rotate(var(--rot))}
  75%{transform:scale(1.06) rotate(var(--rot))}
  100%{transform:scale(1) rotate(var(--rot))}
}
@media (prefers-reduced-motion:reduce){.stamp.fresh{animation:none}}
.stamp-more{position:absolute;right:-5px;top:-3px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:800;line-height:17px;text-align:center;font-variant-numeric:tabular-nums}
/* 목록 카드: 사진이 있으면 사진 왼쪽 아래 모서리에 걸쳐 찍고, 없으면 사진 자리에 */
.place-side{position:relative;flex:none}
.place-side>.stamp-wrap{position:absolute;left:-12px;bottom:-12px;--sz:48px}
.place-side.solo>.stamp-wrap{position:static;--sz:54px}
.list{overflow-x:clip} /* '쾅' 하고 커졌다 줄어드는 도장이 화면 옆으로 삐져나가지 않게 */
/* 준우승 태그는 길면 주소와 같이 줄어들며 말줄임 */
.tag{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--c-soft);color:var(--ink);white-space:nowrap}
.meta .cat{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 준우승 태그가 있으면 칸이 모자랄 때 주소부터 줄이고, 그래도 모자라면 카테고리와 태그가 나눠서 말줄임 */
.meta.has-tag{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,max-content) minmax(0,1fr)}
.meta.has-tag>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.honors{display:flex;flex-wrap:wrap;gap:12px 14px;margin-top:16px}
.honor{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;text-align:center;--sz:64px}
.honor small{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.honor-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.win-stamp{display:flex;justify-content:center;margin:18px 0 6px;--sz:112px}
.win-msg{margin:6px 0 0;font-weight:700}
.rec-year{font-size:14px;font-weight:750;margin:22px 0 10px}
.rec-year:first-of-type{margin-top:14px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px 14px}
.rec+.rec{margin-top:10px}
.rec-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rec-title{font-weight:750;letter-spacing:-0.02em}
.rec-row{border-left:3px solid var(--c);padding:1px 0 1px 11px;margin-top:10px}
.rec-line{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.rec-row .who{display:flex;align-items:center;gap:7px;font-weight:750;font-size:14px;min-width:0}
.rec-win{display:flex;align-items:center;gap:6px;margin-top:2px;font-weight:750;font-size:16px;line-height:1.35}
.rec-win svg{width:17px;height:17px;flex:none;color:var(--c)}
.rec-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec-sub .text-btn{padding:0 2px;font-size:13px}
.link{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.gone{color:var(--muted);font-weight:600}
.photo{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r-m);background:var(--sunken);margin:6px 0 4px}
.photo-actions{display:flex;align-items:center;gap:8px;margin-top:12px}
.photo-actions label{position:relative}
/* 장소 추가 화면: 고른 사진 미리보기 */
label.field>.photo-previews{display:flex;flex-wrap:wrap;gap:6px;margin:0} /* label.field>span 기본 모양(한 줄 제목) 덮어씀 */
label.field>.photo-previews:not(:empty){margin-top:8px}
.photo-preview{position:relative;display:block;width:72px;height:72px}
.photo-preview img{display:block;width:100%;height:100%;object-fit:cover;border-radius:10px;background:var(--sunken)}
.cover-badge{position:absolute;left:6px;top:6px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;line-height:18px;pointer-events:none}
/* 상세: 사진 넘겨 보기 */
.gallery{position:relative;margin:6px 0 4px}
.gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r-m);background:var(--sunken);scrollbar-width:none;overscroll-behavior-x:contain}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-item{position:relative;flex:0 0 100%;scroll-snap-align:start;border:0;padding:0;background:none;display:block;cursor:zoom-in}
.gallery-item img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.gallery-item .cover-badge{left:10px;top:10px}
.gallery-count{position:absolute;right:10px;bottom:10px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none}
/* 크게 보기 */
.viewer{position:fixed;inset:0;z-index:30;background:#000;animation:fade .15s ease}
.viewer-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.viewer-track::-webkit-scrollbar{display:none}
.viewer-item{flex:0 0 100%;height:100%;scroll-snap-align:start;display:grid;place-items:center}
.viewer-item img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-close{position:absolute;right:max(8px, env(safe-area-inset-right));top:max(8px, env(safe-area-inset-top));color:#fff;background:rgba(0,0,0,.45)}
.viewer-close:hover{background:rgba(0,0,0,.65)}
.viewer-count{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:3px 11px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.viewer{animation:none}}
textarea.input.url{min-height:0;resize:none;line-height:1.45}
.settings-group{margin-top:22px}
.settings-group h3{font-size:14px;margin:0 0 10px}
.settings-group .error:empty{display:none} /* 오류가 없을 땐 자리를 비워 두지 않음 (묶음 사이 간격이 벌어지지 않게) */
.settings-group .btn.block{margin-top:0} /* 상세 화면용 .block{margin-top} 이 꽉 찬 버튼(.btn.block)에도 걸려서 벌어지던 간격 */
.app-version{margin:16px 0 0;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:flex-end}
.row .field{flex:1;margin:0}

/* ---------- 방: 방 고르기, 내 정보의 방·멤버 ---------- */
.room-list{list-style:none;margin:0;padding:0}
.room-list li+li{margin-top:10px}
.room-card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:14px 16px}
.room-card:active{background:var(--sunken)}
.room-top{display:flex;align-items:center;gap:8px;min-width:0}
.room-name{font-size:17px;font-weight:750;letter-spacing:-0.02em;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.room-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.room-dots{display:inline-flex;gap:3px}
.room-actions{display:flex;gap:8px;margin-top:14px}
.room-actions .btn{flex:1}
.badge{flex:none;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.member-list{list-style:none;margin:0;padding:0}
.member-list li{display:flex;align-items:center;gap:7px;padding:7px 0;font-weight:650;min-width:0;overflow-wrap:anywhere}
.member-list li+li{border-top:1px solid var(--line)}
.member-count{font-weight:600;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.room-title{font-size:17px;font-weight:750;margin:0;overflow-wrap:anywhere}
/* 내 색 고르기: 지름 32px 동그라미, 한 줄 8개(무지개 순서). 다른 멤버가 쓰는 색·그와 거의 같은 색은 아예 안 보여 줌 */
.swatches{display:grid;grid-template-columns:repeat(8,32px);justify-content:space-between;gap:10px 0}
.swatch{width:32px;height:32px;border-radius:50%;border:0;padding:0;background:var(--c);display:grid;place-items:center;color:var(--on,#fff);box-shadow:inset 0 0 0 1px var(--ring)}
.swatch svg{width:18px;height:18px;display:none}
.swatch[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--ring),0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.swatch[aria-pressed="true"] svg{display:block}
.color-busy .swatch,.color-busy .custom-pick{opacity:.6;cursor:default}
/* 직접 고르기: 무지개 동그라미(지금 직접 고른 색이면 그 색 + 체크) + 이름. 누르면 아래에 색 판·색 코드 칸이 열림 */
.custom-pick{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:10px 12px;text-align:left}
.custom-pick .swatch{flex:none;pointer-events:none}
.custom-pick .rainbow{background:conic-gradient(#F53C41,#F87805,#F7CD03,#84C903,#04BB3D,#0CD2A9,#04AEE0,#0182F3,#5E4DEE,#AC55F4,#DB3CC6,#EC4179,#F53C41)}
.custom-pick .swatch svg{display:block}
.custom-pick .rainbow svg{width:16px;height:16px;color:#fff;filter:drop-shadow(0 0 1.5px rgb(0 0 0 / .55))}
.custom-pick .swatch.on{box-shadow:inset 0 0 0 1px var(--ring),0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.custom-pick .txt{flex:1;min-width:0}
.custom-pick b{display:block;font-weight:750;font-size:15px}
.custom-pick small{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.custom-pick .chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .15s}
.custom-pick[aria-expanded="true"] .chev{transform:rotate(180deg)}
.custom-panel{margin-top:8px;padding:14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.custom-row{display:flex;align-items:center;gap:10px}
.color-well{flex:none;position:relative;width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ring)}
.color-well input{-webkit-appearance:none;appearance:none;display:block;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.color-well input::-webkit-color-swatch-wrapper{padding:0}
.color-well input::-webkit-color-swatch{border:0;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ring)}
.color-well input::-moz-color-swatch{border:0;border-radius:50%}
.hex-field{flex:1;min-width:0;margin:0}
.hex-field .input{font-variant-numeric:tabular-nums;letter-spacing:.06em;text-transform:uppercase}
.hex-field .input::placeholder{text-transform:none;letter-spacing:0}
.custom-row .btn{flex:none;min-height:46px}
.custom-note{display:flex;align-items:flex-start;gap:7px;min-height:1.5em;margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.custom-note .dot{margin-top:5px}
.custom-note.warn{color:var(--ink)}
.custom-note.error{color:var(--danger)}
.custom-note.warn::before,.custom-note.error::before{content:"!";flex:none;display:inline-grid;place-items:center;width:17px;height:17px;margin-top:1px;border-radius:50%;font-size:11.5px;font-weight:900;color:#fff;background:var(--danger)}
.custom-note.warn::before{background:#C26A00}
@media (prefers-color-scheme: dark){.custom-note.warn::before{background:#E08A1E}}
/* 내 정보 → 계정 설정 줄 */
.nav-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:12px 12px 12px 14px}
.nav-row .ico{flex:none;width:36px;height:36px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;color:var(--ink)}
.nav-row .ico svg{width:20px;height:20px}
.nav-row .txt{flex:1;min-width:0}
.nav-row b{display:block;font-weight:750;font-size:15px}
.nav-row small{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.nav-row .chev{flex:none;width:20px;height:20px;color:var(--muted)}
.room-card.current{border-color:var(--ink);cursor:default}
.badge.now{background:var(--ink);color:var(--bg)}

/* ---------- 공개 방 (v0.2.0): 공개 표시, 둘러보기, 읽기 전용 보기, 공개 범위 고르기, 동의 ---------- */
.badge.pub{background:transparent;color:var(--p1-ink);box-shadow:inset 0 0 0 1px var(--p1)}
.title .badge,.room-title .badge{display:inline-block;vertical-align:4px;margin-left:6px;letter-spacing:0}
/* 방 고르기 화면 제목 줄: 오른쪽에 돋보기 */
.gate-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.gate-head h1{flex:1;min-width:0}
.gate-head .icon-btn{flex:none;margin-top:-4px}
/* 읽기 전용 띠: 높이 40px, 360px 폰에서도 한 줄. 닫기는 누르는 영역 44px */
.visit-band{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;margin:0 calc(var(--gutter) * -1);padding:0 0 0 var(--gutter);background:var(--p1-soft);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}
.visit-band>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.visit-band .text-btn{flex:none;height:44px;margin:-2px 0;padding:0 var(--gutter) 0 12px;color:var(--ink)}
.visit-desc{margin:4px 0 0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.visit-note{margin:10px 0 0;padding:10px 14px;border-radius:var(--r-m);background:var(--sunken);font-size:13.5px;color:var(--muted)}
.seg span{flex:1;text-align:center;border-radius:999px;padding:9px 0;font-weight:700;color:var(--muted)}
.seg span[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note-text{margin:0;white-space:pre-wrap;word-break:break-word}
.photo-ph{display:block;width:100%;aspect-ratio:16/10;background:var(--sunken)}
.viewer-item .photo-ph{width:min(100%,640px);background:#222}
/* 둘러보기 */
.ex-head{display:flex;align-items:center;gap:4px;padding:10px 0 6px;margin-left:-8px}
.ex-head h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-0.03em}
.ex-count{margin:8px 0 2px;font-size:13px;color:var(--muted)}
.explore-list{list-style:none;margin:8px 0 0;padding:0 0 48px}
.explore-list li+li{margin-top:10px}
.ex-card{display:block;width:100%;min-height:88px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:14px 16px}
.ex-card:active{background:var(--sunken)}
.ex-top{display:flex;align-items:flex-start;gap:6px;min-width:0}
.ex-name{min-width:0;font-size:17px;font-weight:750;letter-spacing:-0.02em;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ex-top .badge{margin-top:3px}
.ex-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.ex-stats{display:block;margin-top:8px;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ex-foot{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--muted);white-space:nowrap;min-width:0}
/* 방 만들기: 공개 범위 카드 */
.vis-pick{display:grid;gap:8px}
.vis-card{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);cursor:pointer}
.vis-card input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--p1)}
.vis-card b{display:block;font-size:15px;font-weight:750}
.vis-card small{display:block;font-size:12.5px;color:var(--muted)}
.vis-card:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vis-card[aria-disabled="true"]{opacity:.55;cursor:default}
.pub-box{margin:0 0 12px;padding:12px 14px;border-radius:var(--r-m);background:var(--p1-soft);font-size:13.5px;line-height:1.6}
.pub-box p{margin:0}
.pub-box p+p{margin-top:6px}
.pub-guide{margin:4px 0 0;padding:12px 14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.pub-guide h4{margin:10px 0 2px;font-size:13.5px}
.pub-guide h4:first-child{margin-top:0}
.pub-guide p,.pub-guide ul{margin:0}
.pub-guide ul{padding-left:18px}
.text-btn.inline{padding:6px 0;color:var(--p1-ink)}
.ack-check{display:flex;align-items:center;gap:10px;min-height:44px;margin:4px 0 8px;font-weight:700;cursor:pointer}
.ack-check input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--p1)}
.ack-text p{margin:0 0 10px}
/* 내 방에 담기: 방 고르기 카드(라디오처럼 하나만), 담은 뒤 안내 */
button.vis-card{width:100%;text-align:left;font:inherit;color:inherit}
.vis-card .radio{flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-strong)}
.vis-card[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vis-card[aria-checked="true"] .radio{box-shadow:inset 0 0 0 5px var(--p1)}
.vis-card .badge{display:inline-block;vertical-align:2px;margin-left:6px}
.copy-place{margin:2px 0 14px;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.copy-done{text-align:center;padding:20px 0 4px}
.copy-done .ok{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:var(--p1-soft);color:var(--p1-ink);display:grid;place-items:center}
.copy-done .ok svg{width:28px;height:28px}
.copy-done p{margin:0 0 4px;overflow-wrap:anywhere}
.copy-done .btn{margin-top:10px}
/* 동의·안내 문장은 낱말 중간에서 줄을 바꾸지 않음 (긴 방 이름은 overflow-wrap이 지킴) */
.ack-text p,.pub-box p,.pub-guide p,.pub-guide li,.copy-done p,.invite.pub .hint,.sheet-body .hint,.gate .hint{word-break:keep-all;overflow-wrap:anywhere}
/* 공개 방 첫 멤버 초대 띠: 둘러보기 링크(보기만) / 초대 코드(멤버로 참여) 두 줄 */
.invite.pub{display:block}
.invite-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.invite-row+.invite-row{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.invite-row small{font-size:12.5px;color:var(--muted)}
.invite.pub .hint{margin-top:10px}
/* 내 정보: 공개 방 묶음, 초대 코드 다시 만들기 */
.pub-status{margin:0 0 10px;font-size:14px}
.pub-actions{display:flex;gap:8px;margin-bottom:12px}
.pub-actions .btn{flex:1;padding-left:8px;padding-right:8px}
.desc-label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.desc-text{margin:0;font-size:15px;overflow-wrap:anywhere}
.regen-btn{display:block;margin:8px auto 0}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.loading{min-height:100dvh;display:grid;place-items:center;color:var(--muted)}
/* 검색 결과가 다른 탭에 있을 때 */
.other-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.other-tabs.more{justify-content:flex-start;align-items:center;margin:8px 0 0;font-size:13px;color:var(--muted)}
.other-tabs.more>span{margin-right:2px}


/* '다녀왔어요'를 누른 직후 새 방문 칸 위 안내 */
.visit-guide{margin:4px 0 8px;padding:8px 12px;border-radius:var(--r-s);background:var(--p1-soft);color:var(--ink);font-size:13px;line-height:1.45;word-break:keep-all}

/* 장소 추가: 이미 담은 곳 알림 (막지는 않음) */
.dup-hint{display:flex;align-items:center;gap:8px;margin:-6px 0 14px;padding:8px 6px 8px 12px;border-radius:var(--r-s);background:var(--p2-soft);font-size:13px;line-height:1.45;word-break:keep-all}
.dup-hint:empty{display:none}
.dup-hint>span{min-width:0;overflow-wrap:anywhere} /* 띄어쓰기 없는 긴 이름도 줄바꿈 ([열기]가 밖으로 밀리지 않게) */
.dup-hint .text-btn{flex:none;margin-left:auto;padding:4px 8px;color:var(--p2-ink);white-space:nowrap;font-size:13px}
/* 상세: 이 폰에 남겨 둔 쓰던 후기·메모를 다시 채웠다는 한 줄 (알림은 입력칸을 가려서 안 씀) */
.draft-line{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);word-break:keep-all}
.draft-line .text-btn{padding:2px 4px;font-size:12.5px;color:var(--p1)}

</style>
</head>

<script>
/* =====================================================================

const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_KEY = 'YOUR_KEY';

const nickKey = (v) => String(v || '').normalize('NFKC').replace(/[\u00ad\u034f\u180e\u200b-\u200f\u202a-\u202e\u2060-\u2069\ufeff]/g, '').trim().toLowerCase();

const EXPLORE_HINT_KEY = 'group-place:explore-hint'; // localStorage: 돋보기 첫 안내를 봤는지
const NOTICE_KEY = 'group-place:notice-v020';        // localStorage: '새 기능: 공개 방' 한 번 알림을 봤는지

/* ---------- 작은 도우미 ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STAR = 'M12 2.6l2.8 5.9 6.4.8-4.7 4.5 1.2 6.4L12 17.1l-5.7 3.1 1.2-6.4-4.7-4.5 6.4-.8z';
const ICON = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

  heart: (on) => `<svg viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.3A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/></svg>`,
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',

  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z"/><path d="M16.5 6H20v1a3.5 3.5 0 0 1-3.8 3.5M7.5 6H4v1a3.5 3.5 0 0 0 3.8 3.5"/><path d="M12 14v3.5M8.5 20.5h7M9.5 17.5h5v3h-5z"/></svg>',
};
const STAR_HALF = 'M12 2.6v14.5l-5.7 3.1 1.2-6.4-4.7-4.5 6.4-.8z'; // 별의 왼쪽 절반
const starSvg = `<path d="${STAR}"/><path class="h" d="${STAR_HALF}"/>`;
// i번째 별: 'on' 전체, 'half' 왼쪽 절반만 칠함
const starCls = (n, i) => (n >= i ? 'on' : n >= i - 0.5 ? 'half' : '');
const stars = (n, size = 14) => {
  let s = '';
  for (let i = 1; i <= 5; i++) s += `<svg class="${starCls(n, i)}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${starSvg}</svg>`;
  return `<span class="stars" role="img" aria-label="5점 만점에 ${n}점">${s}</span>`;
};
// 별 하나를 반으로 나눠 왼쪽을 누르면 x.5점, 오른쪽을 누르면 x점
function rateInput(n) {
  let s = '';
  for (let i = 1; i <= 5; i++) {
    s += `<span class="rs ${starCls(n, i)}"><svg viewBox="0 0 24 24" aria-hidden="true">${starSvg}</svg>`
      + `<button type="button" data-action="rate" data-n="${i - 0.5}" aria-label="${i - 0.5}점" aria-pressed="${n === i - 0.5}"></button>`
      + `<button type="button" data-action="rate" data-n="${i}" aria-label="${i}점" aria-pressed="${n === i}"></button></span>`;
  }
  return `<div class="rate-input" role="group" aria-label="내 별점">${s}</div>`;
}
// 받침에 맞는 조사: josa('지훈', '이', '가') → '지훈이'. 끝의 괄호·기호는 건너뜀: '도윤 (주말만 가능)' → '…가능)이'
const josa = (word, withFinal, withoutFinal) => {
  const ch = String(word).trim().replace(/[^\p{L}\p{N}]+$/u, '').slice(-1);
  const code = ch.charCodeAt(0) - 0xac00;
  if (!(code >= 0 && code <= 11171)) return `${word}${withFinal}(${withoutFinal})`;
  return word + (code % 28 ? withFinal : withoutFinal);
};
const fmtDate = (iso) => {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
};
const fmtDay = (day) => day.replaceAll('-', '.'); // 방문일 'YYYY-MM-DD' → 'YYYY.MM.DD'
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const safeUrl = (u) => {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
};
let toastTimer;
// ms = 0이면 다음 알림이 올 때까지 계속 보임 (사진 올리는 중처럼 오래 걸리는 일)
function toast(msg, ms = 2200) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function friendly(err) {
  const m = (err && (err.message || err.error_description || err.msg)) || String(err || '');
  if (/save_visit_review|stability_schema_version/.test(m) && /does not exist|schema cache|Could not find/i.test(m))

  if (/visit_gone/.test(m)) return '그 방문 기록이 바뀌거나 지워졌어요. 새로고침한 뒤 다시 남겨 주세요.';
  if (/save_context_changed/.test(m)) return '방이나 계정이 바뀌어 저장을 중단했어요. 원래 방에서 다시 시도해 주세요.';
  if (/maintenance_version|trash_item/.test(m) && /does not exist|schema cache|Could not find/i.test(m)) return '현재 버전용 SQL(supabase/maintenance.sql)을 먼저 실행해 주세요.';
  if (/review_changed|visit_changed|note_changed/.test(m)) return '다른 기기나 멤버가 먼저 고쳤어요. 쓰던 내용은 남아 있어요. 최신 기록을 확인한 뒤 다시 저장해 주세요.';
  if (/other_reviews/.test(m)) return '다른 멤버 후기가 있는 방문은 지울 수 없어요.';

/* ---------- 데이터 ---------- */
// 불러오기마다 번호를 매겨서, 늦게 끝난 예전 불러오기가 그사이 바뀐 방(또는 더 새 내용)을 덮어쓰지 않게 함

async function loadAll() {
  const gen = ++loadGen;
  try { return await loadRoomData(gen); }
  catch (err) { if (gen !== loadGen) return false; throw err; } // 예전 불러오기의 오류는 버림

async function loadRoomData(gen) {
  const [c, m] = await Promise.all([
    sb.from('couples').select('id, name, invite_code, created_at, visibility, description, public_key, public_hidden_at').order('created_at'),
    sb.from('couple_members').select('couple_id, user_id, display_name, role, color, created_at').order('created_at'),
  ]);

  // 방 조건(couple_id)이 꼭 있어야 함: 없으면 내가 든 다른 방 데이터까지 섞여 옴

    sb.from('places').select('*, reviews(*), visits!visits_place_id_fkey(*), place_photos(*)').eq('couple_id', room).order('created_at', { ascending: false }),
    sb.from('categories').select('id, name, position').eq('couple_id', room).order('position').order('created_at'),

  state.cupResults = w.error ? [] : w.data || [];

  const visits = p.visits

/* ---------- 사진 (비공개 버킷 → 서명 URL) ---------- */
const MAX_PHOTOS = 10; // 장소마다 최대 사진 수

  const need = state.places.flatMap((p) => [...p.photos.map((x) => x.path), p.photos[0] && p.photos[0].thumb_path].filter(Boolean))

    const failed = r.tried - r.done;

// 표에서 먼저 지우고 파일을 지움 (파일만 남는 건 괜찮지만, 없는 파일을 가리키면 안 되니까)

async function setCover(place, photo) {

async function refresh({ keepSheet = true } = {}) {

    throw err;

  if (done === false) return; // 더 새 불러오기가 그릴 것

// 다른 방으로 (방 고르기, 내 정보의 방 바꾸기, 방을 만들거나 들어온 뒤). 여러 번 눌러도 마지막 방만 그려짐
async function switchRoom(id) {
  forcePicker = false;
  if (id !== state.roomId || state.loadedRoom !== id) resetRoomView();
  else if (state.sheet) closeSheet();
  state.roomId = id;
  rememberRoom(id);
  state.couple = state.rooms.find((r) => r.id === id) || null;
  state.members = state.couple ? membersOf(id) : [];
  state.loadError = false;
  render(); // 불러오는 중

}

  <div class="sheet-body">
    <p class="hint" style="margin:4px 0 12px">내 방 ${state.rooms.length}/${MAX_ROOMS}개 · 방을 누르면 그 방으로 바뀌어요.</p>
    <ul class="room-list">${state.rooms.map((r) => roomCard(r, null, r.id === state.roomId)).join('')}</ul>

// 방 카드: 방 이름, 멤버 점(최대 5개), 인원, 내 닉네임, 방장·최근 표시. current면 지금 방(누르면 시트만 닫힘)
function roomCard(r, last, current = false) {

      <span>${ms.length}/${MAX_MEMBERS}명</span>${me ? `<span>· ${esc(me.display_name)}</span>` : ''}${me && me.role === 'owner' ? '<span class="badge">방장</span>' : ''}</span>

// 방 데이터를 불러오는 중 (실패했으면 다시 시도)

/* ---------- 화면: 메인 목록 ---------- */
const avgRating = (p) => {
  const rs = p.reviews.map((r) => r.rating).filter(Boolean);
  return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
};
// 그 사람이 가장 최근 방문에 남긴 별점
const latestRating = (p, userId) => {
  for (const v of p.visits) {
    const r = v.reviews.find((x) => x.author_id === userId && x.rating);
    if (r) return r.rating;
  }
  return null;
};
// 읽기 전용이면 방문·담은 날짜가 'YYYY-MM'(월까지만)이라 같은 꼴끼리 비교됨
const lastDay = (p) => (p.visits[0] ? p.visits[0].visited_on : p.created_at.slice(0, 10));
function filtered() {
  const list = matched();
  const u = ui();
  if (u.tab === 'visited') {
    // 평점순: 카드에 보이는 평균 평점(소수 한 자리) 높은 순 → 같으면 방문 많은 순 → 그래도 같으면 최근 방문순. 평점 없으면 맨 뒤
    // 최근 방문순: 마지막 방문일(기록이 없으면 담은 날) / 최근 추가순: 장소를 담은 시각
    const shown = (p) => { const a = avgRating(p); return a == null ? -1 : Number(a.toFixed(1)); };
    const desc = (x, y) => (x < y ? 1 : x > y ? -1 : 0);
    list.sort(u.sort === 'rating'
      ? (a, b) => desc(shown(a), shown(b)) || desc(a.visits.length, b.visits.length) || desc(lastDay(a), lastDay(b))
      : u.sort === 'added'
        ? (a, b) => desc(a.created_at, b.created_at)
        : (a, b) => desc(lastDay(a), lastDay(b)));
  }
  return list;
}
function matched(tab = ui().tab) {
  const u = ui();
  const q = u.query.trim().toLowerCase();
  return curPlaces().filter((p) => {
    if (tab === 'fav' ? !p.favorite : p.status !== tab) return false;
    if (u.category !== '전체' && p.category !== u.category) return false;
    if (!q) return true;
    return [p.name, p.address, p.shared_note, p.category].some((v) => (v || '').toLowerCase().includes(q))
      || p.reviews.some((r) => (r.body || '').toLowerCase().includes(q));
  });
}
// 목록 카드의 별점 칩: 최근 별점을 남긴 멤버만, 들어온 순서로. 멤버가 2명 이하면 별 5개, 3명 이상이면 '닉네임 ★4.5'로 줄임
function pairTags(p) {
  const mini = memberOrder().length > 2;
  return memberOrder().map((m) => {
    const n = latestRating(p, m.user_id);
    if (!n) return '';
    const who = person(m.user_id);
    if (mini) {
      return `<span class="voice-tag mini ${who.cls}" role="img" aria-label="${esc(`${who.name} ${n}점`)}"><i class="dot"></i><span class="nm">${esc(who.name)}</span>`
        + `<span class="sc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR}"/></svg>${n.toFixed(1)}</span></span>`;
    }
    return `<span class="voice-tag ${who.cls}"><i class="dot"></i><span class="nm">${esc(who.name)}</span>${stars(n, 13)}</span>`;
  }).join('');
}
function placeCard(p) {
  const by = person(p.created_by);
  const avg = avgRating(p);
  // 아무도 별점을 안 남겼으면 칩도 평균도 없음
  const tags = p.status === 'visited' ? pairTags(p) : '';
  const lower = p.status === 'visited'
    ? (tags || avg ? `<div class="pair"><div class="pair-tags">${tags}</div>${avg ? `<span class="avg" role="img" aria-label="평균 ${avg.toFixed(1)}점"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR}"/></svg>${avg.toFixed(1)}</span>` : ''}</div>` : '')
    : `<div class="added ${by.cls}"><i class="dot"></i>${esc(josa(by.name, '이', '가'))} 담음 <span aria-hidden="true">|</span> ${ro() ? esc(fmtMonth(p.created_at)) : fmtDate(p.created_at)}</div>`;
  const img = photoUrl(p);
  // 도장은 가장 앞선 것 하나(+나머지 개수), 준우승은 카테고리 옆에 태그 하나(+나머지 개수)
  const { stamps, seconds } = honorsOf(p.id);
  const stamp = stamps.length ? stampHtml(stamps[0], stamps.length - 1) : '';
  return `<li><button class="place" data-action="open" data-id="${p.id}">
    <div class="place-row">
      <div class="place-main">
        <div class="place-top">
          <span class="place-name">${esc(p.name)}</span>
          ${p.favorite ? `<span class="heart-mark" aria-label="찜">${ICON.heart(true)}</span>` : ''}
        </div>
        <div class="meta${seconds.length ? ' has-tag' : ''}"><span class="cat">${esc(p.category)}</span>${seconds.length ? secondTag(seconds[0], seconds.length - 1) : ''}${p.address ? `<span class="addr">${esc(p.address)}</span>` : ''}</div>
        ${p.shared_note ? `<p class="note-prev">${esc(p.shared_note)}</p>` : ''}
      </div>
      ${img || stamp ? `<div class="place-side${img ? '' : ' solo'}">${img ? `<img class="thumb" src="${esc(img)}" alt="" loading="lazy">` : ''}${stamp}</div>` : ''}
    </div>
    ${lower}
  </button></li>`;
}
const TAB_NAMES = { want_to_go: '가고 싶은 곳', visited: '다녀온 곳', fav: '찜' };
function otherTabs(list) {
  if (!ui().query.trim()) return [];
  const shown = new Set(list.map((p) => p.id));
  const tabs = ui().tab === 'fav' ? ['want_to_go', 'visited'] : [ui().tab === 'visited' ? 'want_to_go' : 'visited'];
  return tabs.map((t) => ({ t, n: matched(t).filter((p) => !shown.has(p.id)).length })).filter((x) => x.n);
}
function listHtml() {
  const list = filtered();
  const others = otherTabs(list);
  const go = others.map(({ t, n }) => `<button class="chip" data-action="tab" data-tab="${t}">${TAB_NAMES[t]} ${n}곳 보기</button>`).join('');
  const emptyMsg = others.length
    ? `<strong>이 탭에는 없어요</strong>다른 탭에 검색어와 맞는 곳이 있어요.<div class="other-tabs">${go}</div>`
    : ui().query || ui().category !== '전체'
    ? '<strong>조건에 맞는 장소가 없어요</strong>검색어나 카테고리를 바꿔 보세요.'
    : ui().tab === 'want_to_go' ? '<strong>가고 싶은 곳을 담아 보세요</strong>오른쪽 아래 버튼으로 첫 장소를 추가해요.'
    : ui().tab === 'visited' ? '<strong>아직 다녀온 곳이 없어요</strong>가고 싶은 곳에서 ‘다녀왔어요’를 누르면 여기로 옮겨져요.'
    : '<strong>찜한 곳이 없어요</strong>장소를 열고 하트를 누르면 여기에 모여요.';
  if (!list.length) return `<div class="empty-state">${emptyMsg}</div>`;
  return `${others.length ? `<div class="other-tabs more"><span>다른 탭에도 있어요</span>${go}</div>` : ''}<ul class="list">${list.map(placeCard).join('')}</ul>`;
}
// 메인 위쪽 방 이름: 누르면 방 바꾸기·새 방 시트. 마지막 낱말과 ⌄는 같은 줄에 (낱말이 아주 길면 그냥 줄바꿈)
function roomTitleBtn(name) {
  const i = name.lastIndexOf(' ');
  const head = i >= 0 ? name.slice(0, i + 1) : '', tail = i >= 0 ? name.slice(i + 1) : name;
  const end = [...tail].length <= 10 ? `<span class="tail">${esc(tail)}${ICON.down}</span>` : `${esc(tail)}${ICON.down}`;
  return `<button class="title-btn" data-action="rooms" aria-haspopup="dialog" aria-label="${esc(`${name}, 방 바꾸기와 새 방`)}">${esc(head)}${end}</button>`;
}
// 첫 멤버가 들어올 때까지 메인에 보이는 초대 띠 (읽기 전용에서는 부르지 않음).
// 공개 방이면 두 줄: 둘러보기 링크(보기만) / 초대 코드(멤버로 참여) + 둘의 차이 안내 (§4.11)
function inviteBand() {
  const c = state.couple;
  if (!c.invite_code || state.members.length !== 1) return '';
  if (!isPublicRoom(c)) return `<div class="invite"><div>친구에게 초대 코드를 보내 주세요<br><b>${esc(c.invite_code)}</b></div><button class="btn small" data-action="copy-code">복사</button></div>`;
  const link = PUBLIC_ROOMS_ENABLED && PUBLIC_KEY_RE.test(String(c.public_key || ''));
  return `<div class="invite pub">
      ${link ? '<div class="invite-row"><div>둘러보기 링크 <small>보기만</small></div><button class="btn small ghost" data-action="share-link">공유</button></div>' : ''}
      <div class="invite-row"><div>초대 코드 <small>멤버로 참여</small><br><b>${esc(c.invite_code)}</b></div><button class="btn small" data-action="copy-code">복사</button></div>
      <p class="hint">초대 코드를 받은 사람은 멤버로 들어와 장소를 고치고 지울 수 있어요. 보기만 할 사람에게는 링크를 보내 주세요.</p>
    </div>`;
}
// 메인 목록. 읽기 전용(공개 방 둘러보기)이면 같은 함수가 띠·머리만 바꾸고 고치는 단추(초대 띠·톱니·트로피·찜 탭·장소 추가)는 그리지 않음
function viewMain() {
  const r = ro(), u = ui(), places = curPlaces();
  if (r && state.visit.status !== 'ok') return visitStateView();
  const want = places.filter((p) => p.status === 'want_to_go').length;
  const visited = places.filter((p) => p.status === 'visited').length;
  const fav = r ? 0 : places.filter((p) => p.favorite).length;
  const cats = ['전체', ...new Set([...(r ? state.visit.data.categories : catNames()), ...places.map((p) => p.category)])];
  const tabBtn = (key, label, n) => `<button role="tab" data-action="tab" data-tab="${key}" aria-selected="${u.tab === key}">${label}<span class="n">${n}</span></button>`;
  const sortBtn = (key, label) => `<button data-action="sort" data-sort="${key}" aria-pressed="${u.sort === key}">${label}</button>`;
  const ordered = memberOrder();
  const duo = `<div class="duo" aria-label="멤버">${ordered.map((m) => { const w = person(m.user_id); return `<span class="${w.cls}" title="${esc(w.name)}"><i class="dot"></i><span class="nm">${esc(w.name)}</span></span>`; }).join('')}</div>`;
  const head = r ? visitHeadHtml(duo) : `<div class="top-row">
        <div class="top-head">
          <h1 class="title">${roomTitleBtn(state.couple.name)}${isPublicRoom(state.couple) ? pubBadge : ''}</h1>
          ${duo}
        </div>
        <div class="top-actions">
          <button class="icon-btn" data-action="cup" aria-label="장소 월드컵">${ICON.trophy}</button>
          <button class="icon-btn" data-action="settings" aria-label="내 정보">${ICON.gear}</button>
        </div>
      </div>`;
  return `<div class="top"><div class="wrap">
      ${head}
      <div class="tabs" role="tablist">${tabBtn('want_to_go', '가고 싶은 곳', want)}${tabBtn('visited', '다녀온 곳', visited)}${r ? '' : tabBtn('fav', '찜', fav)}</div>
    </div></div>
    <main class="wrap">
      ${r ? visitNotesHtml() : inviteBand()}
      <div class="tools">
        <div class="search"><label class="sr" for="q">검색</label>${ICON.search}<input class="input" id="q" type="search" placeholder="이름, 주소, 메모, 후기 검색" value="${esc(u.query)}"><button type="button" class="search-clear" data-action="clear-search" aria-label="검색어 지우기">${ICON.close}</button></div>
        <div class="chips" role="group" aria-label="카테고리">${cats.map((c) => `<button class="chip" data-action="cat" data-cat="${esc(c)}" aria-pressed="${u.category === c}">${esc(c)}</button>`).join('')}</div>
        ${u.tab === 'visited' ? `<div class="sort" role="group" aria-label="정렬">${sortBtn('recent', '최근 방문순')}${sortBtn('added', '최근 추가순')}${sortBtn('rating', '평점순')}</div>` : ''}
      </div>
      <div id="list-area">${listHtml()}</div>
    </main>
    ${r ? '' : `<button class="btn fab" data-action="add">${ICON.plus}장소 추가</button>`}`;
}

/* ---------- 시트: 장소 추가/수정 ---------- */
// 공개 방에서 쓰는 순간의 한 줄 안내 (§4.11). 지금 방이 공개 방일 때만, 읽기 전용에서는 없음
const PUB_HINT = {
  place: '공개 방이라 담은 장소를 누구나 볼 수 있어요.',
  note: '공개 방이라 메모도 누구나 볼 수 있어요. 예약자 이름·전화번호·비밀번호는 적지 마세요.',
  photo: '사진도 공개돼요. 얼굴, 특히 아이 사진은 올리지 마세요.',
  review: '후기와 별점도 공개돼요.',
};
const pubHint = (k, style = '') => (!ro() && isPublicRoom(state.couple) ? `<p class="hint pub-hint"${style ? ` style="${style}"` : ''}>${PUB_HINT[k]}</p>` : '');
const catChip = (c, on) => `<button type="button" class="chip" data-action="pick-cat" data-cat="${esc(c)}" aria-pressed="${on}">${esc(c)}</button>`;
function selectCat(form, name) {
  form.category.value = name;
  form.querySelectorAll('[data-action=pick-cat]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.cat === name));
}
function placeForm(p, draft) {
  const blank = { name: '', address: '', category: catNames()[0] || '', naver_url: '', status: state.tab === 'visited' ? 'visited' : 'want_to_go', shared_note: '' };
  const v = p || (draft ? { ...blank, ...draft, category: catNames().includes(draft.category) ? draft.category : blank.category } : blank);
  const cats = [...new Set([...catNames(), v.category])].filter(Boolean);
  const linkField = `<label class="field"><span>지도 링크 (네이버·구글)</span><textarea class="input url" name="naver_url" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://naver.me/… 또는 https://maps.app.goo.gl/…">${esc(v.naver_url || '')}</textarea>
      <p class="hint">공유하기로 복사한 링크나 문구를 붙여넣으면 링크만 골라 넣고, 비어 있는 이름·주소도 채워 줘요. 해외 장소는 구글 지도 링크로.</p></label>`;
  const nameField = `<label class="field"><span>장소 이름</span><input class="input" name="name" maxlength="80" value="${esc(v.name)}" required></label>
    ${p ? '' : '<div class="dup-hint" id="dup-hint" role="status"></div>'}`;
  const catField = `<div class="field"><span style="display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">카테고리</span>
      <div class="cat-pick" role="radiogroup" aria-label="카테고리">${cats.map((c) => catChip(c, v.category === c)).join('')}<button type="button" class="chip add" data-action="new-cat">+ 새 카테고리</button></div>
      <div class="new-cat hidden"><input class="input" maxlength="20" placeholder="새 카테고리 이름" aria-label="새 카테고리 이름" enterkeyhint="done"><button type="button" class="btn small" data-action="add-cat">추가</button></div>
      <input type="hidden" name="category" value="${esc(v.category)}">
    </div>`;
  const addressField = `<label class="field"><span>주소</span><input class="input" name="address" maxlength="200" value="${esc(v.address || '')}"></label>`;
  // 장소 추가는 링크부터 (붙여넣으면 이름·주소가 채워지니까), 정보 수정은 이름부터
  return `<div class="sheet-head"><button class="icon-btn" data-action="close" aria-label="닫기">${ICON.close}</button><h2 id="sheet-title">${p ? '정보 수정' : '장소 추가'}</h2><span style="width:40px"></span></div>

// 네이버 지도 공유 문구 예) "[네이버지도]\n장소명\n서울 ○○구 …\nhttps://naver.me/xxxx"
// 링크엔 ' 가 들어갈 수 있음 (구글 지도 주소창 링크 …/place/Joe's+Pizza/…)
const URL_RE = /https?:\/\/[^\s<>"]+/i;
const URL_RE_G = /https?:\/\/[^\s<>"]+/gi;
// 링크 끝에 붙은 문장부호·글자 떼기 ("…/AbCd." "…/AbCd)" "…/AbCd여기"). 짧은 링크는 정해진 글자까지만
const SHORT_RE = /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|naver\.me)\/[A-Za-z0-9_-]+(\?[A-Za-z0-9_=&%-]*)?/i;
const cleanUrl = (u) => { const s = u.match(SHORT_RE); return (s ? s[0] : u).replace(/[.,!?;:'"’”)\]}]+$/, ''); };
const ADDR_RE = /^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|충청|전북|전남|전라|경북|경남|경상|제주)/;
const isShareText = (t) => URL_RE.test(t) && t.replace(URL_RE_G, '').trim().length > 0;
function parseShare(text) {
  const url = cleanUrl((text.match(URL_RE) || [])[0] || '');
  const lines = text.split(/\r?\n/)
    .map((s) => s.replace(URL_RE_G, '').replace(/^\[[^\]]*\]\s*/, '').trim())
    .filter((s) => s && !/^(네이버\s?지도|naver\s?map|google\s?(지도|maps))$/i.test(s) && !/^[\d\-\s()+]{7,}$/.test(s));
  const name = (lines[0] || '').replace(/\s*[-|:]\s*네이버\s?지도$/i, '').trim();
  const rest = lines.slice(1);
  return { url, name, address: rest.find((s) => ADDR_RE.test(s)) || rest[0] || '' };
}
// 비어 있는 이름·주소 칸만 채우고, 채운 칸 이름을 돌려줌
function fillEmpty(form, s) {
  const filled = [];
  if (!field(form, 'name').value.trim() && s.name) { field(form, 'name').value = s.name; filled.push('이름'); }
  if (!form.address.value.trim() && s.address) { form.address.value = s.address; filled.push('주소'); }
  checkDup(form);
  return filled;
}
// 이미 담은 곳이면 장소 추가 화면에 알려 줌 (저장은 막지 않음).
// 이름은 띄어쓰기·문장부호를 빼고 비교하고, 한쪽이 다른 쪽을 품으면(올디스타코 ⊂ 올디스타코 을지로 2호점) 4글자 이상일 때만 같은 곳으로 봄
const nameKey = (s) => String(s || '').toLowerCase().replace(/[\s.,·'’"()\-_/&]/g, '');
function sameName(a, b) {
  a = nameKey(a); b = nameKey(b);
  if (!a || !b) return false;
  if (a === b) return true;
  const [short, long] = a.length < b.length ? [a, b] : [b, a];
  return short.length >= 4 && long.includes(short);
}
function checkDup(form) {
  const box = form && form.querySelector('#dup-hint');
  if (!box) return;
  const name = field(form, 'name').value, link = googleKey(form.naver_url.value);
  const hits = state.places.filter((p) => sameName(p.name, name) || (link && p.naver_url && googleKey(p.naver_url) === link));
  const p = hits[0];
  box.innerHTML = p ? `<span>이미 담은 곳이에요 · <b>${esc(p.name)}</b> (${p.status === 'visited' ? '다녀온 곳' : '가고 싶은 곳'}, ${esc(josa(person(p.created_by).name, '이', '가'))} 담음${hits.length > 1 ? ` · 외 ${hits.length - 1}곳` : ''})</span>
    <button type="button" class="text-btn" data-action="open" data-id="${p.id}">열기</button>` : '';
}

// 구글 지도 링크면 true (이름·주소는 구글에 물어본 뒤 따로 채움)
function applyShare(form, text) {
  const s = parseShare(text);
  if (!s.url) return false;
  form.naver_url.value = s.url;
  checkDup(form);
  if (isGoogleMaps(s.url)) { fillFromGoogle(form, s); return true; }
  fillEmpty(form, s);
  return false;
}

// 지도 링크 글자: 링크가 없으면 네이버 검색, 구글·카카오 링크면 그 이름, 그 밖은 네이버
function mapLinkText(u) {
  if (!u) return '네이버 지도에서 검색';
  if (isGoogleMaps(u)) return '구글 지도에서 보기';
  try { if (/^(kko\.to|(place\.|m\.)?map\.kakao\.com)$/.test(new URL(safeUrl(u)).hostname)) return '카카오맵에서 보기'; } catch { /* 네이버로 */ }
  return '네이버 지도에서 보기';
}
// 구글 지도 링크 (해외 장소용). 공유 링크엔 이름·주소가 없을 때가 많아서 서버(api/place.js)가 구글 지도에서 읽어 옴
function isGoogleMaps(u) {
  let x;
  try { x = new URL(safeUrl(u)); } catch { return false; }
  const h = x.hostname;
  return h === 'maps.app.goo.gl' || (h === 'goo.gl' && x.pathname.startsWith('/maps'))
    || (/^(www\.|maps\.)?google\.(com|[a-z]{2}|co\.[a-z]{2}|com\.[a-z]{2})$/.test(h) && (h.startsWith('maps.') || /^\/maps(\/|$)/.test(x.pathname)));
}
async function googlePlace(url, signal) {
  const { data } = await sb.auth.getSession();
  const r = await fetch('/api/place', {
    method: 'POST', signal, body: JSON.stringify({ url }),
    headers: { 'content-type': 'application/json', authorization: `Bearer ${(data.session && data.session.access_token) || ''}` },
  });
  if (!r.ok) throw new Error(`place ${r.status}`);
  const j = await r.json();
  return { name: String(j.name || '').trim(), address: String(j.address || '').trim() };
}
// 지도 서버 함수를 미리 불러 둠 (로그인 확인용 공개 키와 구글 연결을 링크 붙여넣기 전에 준비). 15초에 한 번까지
let warmedAt = 0;
async function warmGoogle() {
  if (!/^https?:$/.test(location.protocol) || Date.now() - warmedAt < 15000) return;
  warmedAt = Date.now();
  const { data } = await sb.auth.getSession();
  const token = data.session && data.session.access_token;
  if (token) fetch('/api/place', { method: 'POST', body: '{"warm":true}', headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` } }).catch(() => {});
}
const GOOGLE_WAIT = '구글 지도에서 이름·주소를 가져오는 중…';
const googleKey = (v) => safeUrl(cleanUrl(String(v || '').trim()));
let googleJob = null, googleTimer; // 지금 구글에 묻는 중인 것 { form, url, ctl, done }
// 화면을 닫거나 링크를 바꾸면 묻던 걸 그만두고 '가져오는 중' 알림도 내림
function cancelGoogle() {
  clearTimeout(googleTimer);
  const job = googleJob;
  if (!job) return;
  googleJob = null;
  job.ctl.abort();
  if (job.form.dataset.google === job.url) delete job.form.dataset.google; // 같은 링크를 다시 넣으면 또 물어봄
  if ($('#toast').textContent === GOOGLE_WAIT) $('#toast').classList.remove('show');
}
// 비어 있는 이름·주소를 구글 지도에서 채움. fallback: 구글이 못 준 칸에 쓸 값 (붙여넣은 공유 문구에서 고른 이름·주소)
function fillFromGoogle(form, fallback = {}) {
  clearTimeout(googleTimer);
  const raw = form.naver_url.value.trim();
  const url = googleKey(raw);
  if (!form.isConnected || !isGoogleMaps(url) || form.dataset.google === url) return; // 같은 링크는 한 번만 물어봄
  if (field(form, 'name').value.trim() && form.address.value.trim()) return; // 채울 칸이 없음
  cancelGoogle();
  if (cleanUrl(raw) !== raw) form.naver_url.value = cleanUrl(raw);
  form.dataset.google = url;
  const job = googleJob = { form, url, ctl: new AbortController() };
  toast(GOOGLE_WAIT, 0);
  job.done = (async () => {
    const timer = setTimeout(() => job.ctl.abort(), 12000);
    const info = await googlePlace(url, job.ctl.signal).catch(() => null);
    clearTimeout(timer);
    if (googleJob !== job) return; // 그사이 화면을 닫았거나 링크를 바꿈
    googleJob = null;
    if (!info) delete form.dataset.google; // 실패했으면 다시 붙여넣을 때 또 물어봄
    const filled = fillEmpty(form, info ? { name: info.name || fallback.name, address: info.address || fallback.address } : fallback);
    const what = filled.length ? `${filled.join('·')}${filled[filled.length - 1] === '이름' ? '을' : '를'}` : '';
    if (info) {
      if (what) toast(`구글 지도에서 ${what} 채웠어요.`);
      else if ($('#toast').textContent === GOOGLE_WAIT) $('#toast').classList.remove('show');
    } else toast(`구글 지도에서 이름·주소를 가져오지 못했어요. ${what ? `붙여넣은 문구로 ${what} 채웠어요.` : '직접 적어 주세요.'}`, 5000);
  })();
}

const SHARE_KEY = 'group-place:share';
let addDraft = null;
let sharedText = null; // 아직 장소 추가로 안 연 공유
function takeShare() {
  let text = '';
  try {
    const q = new URLSearchParams(location.search);
    const keys = ['title', 'text', 'url'];
    if (keys.some((k) => q.has(k))) {
      // 같은 내용이 여러 칸에 오면 한 번만 (네이버는 보통 text에 다 넣고, 구글은 url에 링크만 줄 때가 있음)
      const parts = [];
      for (const k of keys) {
        const v = (q.get(k) || '').trim();
        if (!v || parts.some((x) => x.includes(v))) continue;
        for (let i = parts.length - 1; i >= 0; i--) if (v.includes(parts[i])) parts.splice(i, 1);
        parts.push(v);
      }
      // 링크도 글도 없으면(제목만) 공유로 보지 않음
      if ((q.get('text') || '').trim() || (q.get('url') || '').trim()) text = parts.join('\n').slice(0, 4000);
      // 주소창에서 지움 (새로고침해도 다시 담기지 않게). 뒤로 가기 기록(history.state)은 그대로 둠
      keys.forEach((k) => q.delete(k));
      const rest = q.toString();
      history.replaceState(history.state, '', location.pathname + (rest ? `?${rest}` : '') + location.hash);
      try { if (text) sessionStorage.setItem(SHARE_KEY, text); } catch { /* 저장소를 못 쓰면 이번 화면에서만 */ }
    }
  } catch { /* 주소를 못 읽으면 공유 없이 */ }
  if (!text) { try { text = sessionStorage.getItem(SHARE_KEY) || ''; } catch { /* 없음 */ } }
  return text || null;
}
// 목록이 뜬 다음 한 번만: 장소 추가를 열고 공유한 글로 채움
function openShared() {
  if (!sharedText || ro() || !state.roomId || state.loadedRoom !== state.roomId) return;
  const text = sharedText;
  sharedText = null;
  try { sessionStorage.removeItem(SHARE_KEY); } catch { /* 없음 */ }
  // 장소 추가를 쓰다가 지도 앱에서 공유하면 앱이 새로 열림 → 남겨 둔 쓰던 내용 위에 공유한 것을 채움 (빈 칸만, 링크는 공유한 것으로)
  addDraft = takeAddForm();
  openSheet('add');
  const form = $('#place-form');
  if (!form) return;
  const merged = !!(state.sheet && state.sheet.draft);
  if (URL_RE.test(text)) { if (applyShare(form, text)) return; } // 구글 지도는 '가져오는 중'·'채웠어요' 알림을 따로 띄움
  else fillEmpty(form, parseShare(text)); // 링크 없이 이름·주소 글만 공유한 경우
  const name = field(form, 'name').value.trim(), link = form.naver_url.value.trim();
  toast(merged ? '쓰던 장소 추가에 공유한 장소를 채웠어요. 사진을 골랐었다면 다시 골라 주세요.'
    : name ? '공유한 장소를 채웠어요. 카테고리를 고르고 저장해 주세요.'
    : link ? '공유한 링크를 넣었어요. 이름을 적고 저장해 주세요.'
    : '공유한 글에서 장소 정보를 찾지 못했어요. 직접 적어 주세요.', 4000);
}
// 장소 추가를 쓰는 중에 다른 앱으로 가면 쓰던 내용을 이 폰에 잠깐(10분) 남김. 공유하기로 돌아오면 앱이 새로 열려서 화면이 사라지기 때문.
