/* ---------- 명예의 전당: 월드컵 기록, 우승 도장 ---------- */
// 기록의 연도·카테고리를 월드컵 조건과 같은 꼴로: 비운 칸은 'all'(전체 기간) / '전체'(종합)
const recYear = (r) => (r.year == null ? 'all' : String(r.year).padStart(4, '0'));
const recCat = (r) => r.category ?? '전체';
const honorTitle = (year, cat) => `${year === 'all' ? '역대' : year} ${cat === '전체' ? '종합' : cat}`;
const myResult = (year, cat) => state.cupResults.find((r) => r.user_id === uid() && recYear(r) === year && recCat(r) === cat);
// 같은 월드컵(연도 + 카테고리)의 멤버들 기록끼리 묶음
function cupGroups() {
  const groups = new Map();
  for (const r of state.cupResults) {
    const key = `${recYear(r)}|${recCat(r)}`;
    if (!groups.has(key)) groups.set(key, { key, year: recYear(r), cat: recCat(r), rs: [] });
    groups.get(key).rs.push(r);
  }
  return [...groups.values()];
}
// 최근 연도(역대가 맨 앞), 종합, 최근에 한 순
const honorOrder = (a, b) => (a.year === b.year ? 0 : a.year === 'all' ? -1 : b.year === 'all' ? 1 : Number(b.year) - Number(a.year))
  || ((b.cat === '전체') - (a.cat === '전체'))
  || String(b.at).localeCompare(String(a.at));
// 장소마다 받은 1위 도장과 준우승 태그. 기록 하나 = 도장(또는 태그) 하나, 그 기록을 남긴 멤버 색.
// 같은 월드컵에서 여러 멤버가 같은 곳을 골랐으면 도장도 여러 개 (합치지 않음)
let honorCache = { src: null, map: new Map() };
function honorsOf(placeId) {
  if (ro()) return { stamps: [], seconds: [] }; // 월드컵 기록은 공개하지 않음
  if (honorCache.src !== state.cupResults) {
    const map = new Map();
    const slot = (id) => { if (!map.has(id)) map.set(id, { stamps: [], seconds: [] }); return map.get(id); };
    for (const r of state.cupResults) {
      for (const [field, list] of [['champion_id', 'stamps'], ['runner_up_id', 'seconds']]) {
        if (!r[field]) continue;
        // 도장 키는 기록 id로: 카테고리 이름을 바꿔도 '쾅'이 다시 나오지 않게
        slot(r[field])[list].push({ year: recYear(r), cat: recCat(r), at: r.played_at, user_id: r.user_id, key: `${list}:${r.id}:${r.played_at}` });
      }
    }
    map.forEach((h) => { h.stamps.sort(honorOrder); h.seconds.sort(honorOrder); });
    honorCache = { src: state.cupResults, map };
  }
  return honorCache.map.get(placeId) || { stamps: [], seconds: [] };
}
// 처음 보는 도장만 '쾅' 찍히는 효과. 이 기기에서 이미 본 도장은 기억해 둠
const SEEN_KEY = 'group-place:seen-stamps';
const seenStamps = (() => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []); } catch { return new Set(); } })();
function markStampsSeen() {
  const fresh = [...document.querySelectorAll('.stamp.fresh')].map((el) => el.dataset.stamp).filter((k) => !seenStamps.has(k));
  if (!fresh.length) return;
  fresh.forEach((k) => seenStamps.add(k));
  try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seenStamps].slice(-500))); } catch { /* 못 남기면 다음에 한 번 더 찍힐 뿐 */ }
}
// 둥근 도장: 위 '2026'(전체 기간이면 '역대'), 가운데는 카테고리 이름만(전체면 '종합'), 아래 '1위'
function stampSvg(h) {
  const mid = h.cat === '전체' ? '종합' : h.cat;
  const len = [...mid].length;
  const size = len <= 2 ? 25 : len === 3 ? 22 : 20;
  // 네 글자부터는 원 안에 들어가게 폭을 맞춤 (이름은 자르지 않음)
  const fit = len >= 4 ? ` textLength="${len === 4 ? 62 : 66}" lengthAdjust="spacingAndGlyphs"` : '';
  const words = `<text x="50" y="33" font-size="15.5" font-weight="800">${esc(h.year === 'all' ? '역대' : h.year)}</text>
    <text x="50" y="${len <= 2 ? 59.5 : 58.5}" font-size="${size}" font-weight="900"${fit}>${esc(mid)}</text>
    <text x="50" y="80" font-size="17" font-weight="900">1위</text>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g filter="url(#stamp-ink)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="5"/>
    <circle cx="50" cy="50" r="38.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <g class="st-words" fill="currentColor" text-anchor="middle">${words}</g>
  </g></svg>`;
}
// 각자 고른 1위는 그 사람 색 도장
function stampHtml(h, more = 0, fresh = !seenStamps.has(h.key)) {
  const who = person(h.user_id);
  const label = `${who.name}의 ${honorTitle(h.year, h.cat)} 1위`;
  return `<span class="stamp-wrap"><span class="stamp ${who.cls}${fresh ? ' fresh' : ''}" data-stamp="${esc(h.key)}" role="img" aria-label="${esc(label)}">${stampSvg(h)}</span>${more ? `<span class="stamp-more" aria-label="도장 ${more}개 더">+${more}</span>` : ''}</span>`;
}
// 준우승 태그: 카드에선 색으로만(누가 골랐는지), 상세에선 이름까지
const secondTag = (h, more = 0, named = false) => {
  const who = person(h.user_id);
  return `<span class="tag ${who.cls}" title="${esc(`${who.name} 고른 ${honorTitle(h.year, h.cat)} 준우승`)}">#${esc(honorTitle(h.year, h.cat))} 준우승${named ? ` · ${esc(who.name)}` : ''}${more ? ` +${more}` : ''}</span>`;
};
// 끝난 월드컵을 내 기록으로 저장. 같은 월드컵을 다시 했으면 새 결과로 바꿈
async function saveCup() {
  const c = state.cup;
  c.saved = 'saving';
  const prev = myResult(c.year, c.cat);
  c.prev = prev && prev.champion_id !== c.champion ? prev.champion_name : null;
  // 하는 사이 다른 멤버가 카테고리 이름을 바꿨으면 바뀐 이름으로, 장소를 지웠으면 이름만 남김
  const row = () => {
    const keep = (id) => (state.places.some((x) => x.id === id) ? id : null);
    return {
      couple_id: c.roomId, user_id: uid(),
      year: c.year === 'all' ? null : Number(c.year),
      category: c.cat === '전체' ? null : (state.categories.find((x) => x.id === c.catId) || {}).name,
      champion_id: keep(c.champion), champion_name: c.names[c.champion],
      runner_up_id: keep(c.runnerUp), runner_up_name: c.names[c.runnerUp],
      candidates: c.n, played_at: new Date().toISOString(),
    };
  };
  const upsert = (r) => (r.category === undefined
    ? Promise.resolve({ error: { message: 'cup_category_gone' } })
    : sb.from('cup_results').upsert(r, { onConflict: 'couple_id,user_id,year,category' }).select().single());
  let res = await upsert(row());
  // 이 기기가 모르는 사이 다른 멤버가 장소·카테고리를 바꿨을 수 있으니 새로 불러와서 한 번 더 (그사이 방을 바꿨으면 안 함)
  if (res.error && state.roomId === c.roomId) {
    try { await loadAll(); } catch { /* 처음 오류를 그대로 보여 줌 */ }
    res = await upsert(row());
  }
  if (res.error) {
    c.saved = 'error'; c.saveError = friendly(res.error);
  } else {
    // 다른 멤버가 방금 끝낸 월드컵 기록도 같이 보이게 기록 전체를 다시 받음
    const all = await sb.from('cup_results').select('*').eq('couple_id', c.roomId).order('played_at', { ascending: false });
    if (state.roomId === c.roomId) state.cupResults = all.error ? [res.data, ...state.cupResults.filter((r) => r.id !== res.data.id)] : all.data;
    c.saved = 'ok';
    if (c.cat !== '전체' && res.data.category !== c.cat) { c.cat = res.data.category; c.title = cupTitle(c.year, c.cat); } // 바뀐 카테고리 이름으로
  }
  if (state.cup !== c || !state.sheet || state.sheet.type !== 'cup') {
    // 저장하는 사이 다른 화면으로 갔으면: 기록·장소 화면만 새로 그리고, 실패는 알려 줌 (입력 폼은 건드리지 않음)
    if (c.saved === 'error') toast(`월드컵 기록을 저장하지 못했어요. ${c.saveError}`);
    if (state.sheet && (state.sheet.type === 'detail' || (state.sheet.type === 'cup' && !state.cup))) renderSheet();
  } else renderSheet();
  render();
}
async function deleteCupResult(id) {
  const r = state.cupResults.find((x) => x.id === id);
  if (!r || !confirm(`${cupTitle(recYear(r), recCat(r))} 내 기록을 지울까요? 1위 도장도 같이 사라져요.`)) return;
  const { error } = await sb.rpc('trash_item', { p_kind: 'cup', p_id: id });
  if (error) throw error;
  state.cupResults = state.cupResults.filter((x) => x.id !== id);
  renderSheet(); render();
  toast('월드컵 기록을 지웠어요.');
}
const cupTabs = () => `<div class="seg" style="margin:4px 0 8px" role="group" aria-label="월드컵">
  <button type="button" data-action="cup-tab" data-tab="new" aria-pressed="${state.cupTab === 'new'}">새 월드컵</button>
  <button type="button" data-action="cup-tab" data-tab="records" aria-pressed="${state.cupTab === 'records'}">역대 기록${state.cupResults.length ? ` ${cupGroups().length}` : ''}</button>
</div>`;
const placeLink = (id, name) => (id && state.places.some((x) => x.id === id)
  ? `<button class="link" data-action="open" data-id="${esc(id)}">${esc(name)}</button>`
  : `<span>${esc(name)}</span> <span class="gone">(지운 장소)</span>`);
// 월드컵 하나(연도 + 카테고리): 기록을 남긴 멤버만 들어온 순서로, 내가 아직 안 했으면 내 줄('나도 하기')도
function recCard(g) {
  const ids = memberOrder().map((m) => m.user_id);
  const users = [...ids, ...g.rs.map((r) => r.user_id).filter((id, i, a) => !ids.includes(id) && a.indexOf(id) === i)]
    .filter((id) => id === uid() || g.rs.some((r) => r.user_id === id));
  const rows = users.map((id) => {
    const w = person(id), r = g.rs.find((x) => x.user_id === id);
    const who = `<span class="who"><i class="dot"></i><span class="nm">${esc(w.name)}</span>${w.me ? '<span class="you">나</span>' : ''}</span>`;
    if (!r) {
      return `<div class="rec-row ${w.cls}"><div class="rec-line">${who}${w.me
        ? `<button class="text-btn" data-action="cup-play" data-year="${esc(g.year)}" data-cat="${esc(g.cat)}" style="color:var(--p1)">나도 하기</button>`
        : '<span class="rec-sub">아직 안 했어요</span>'}</div></div>`;
    }
    return `<div class="rec-row ${w.cls}">
      <div class="rec-line">${who}<span class="rec-sub">${fmtDate(r.played_at)}</span></div>
      <div class="rec-win">${ICON.trophy}${placeLink(r.champion_id, r.champion_name)}</div>
      <div class="rec-sub">준우승 ${placeLink(r.runner_up_id, r.runner_up_name)} · 후보 ${r.candidates}곳${w.me ? ` · <button class="text-btn danger" data-action="cup-del" data-id="${esc(r.id)}">기록 삭제</button>` : ''}</div>
    </div>`;
  }).join('');
  return `<article class="rec">
    <div class="rec-head"><span class="rec-title">${esc(cupTitle(g.year, g.cat))}</span></div>
    ${rows}
  </article>`;
}
function cupRecordsView() {
  const head = `<div class="sheet-head"><button class="icon-btn" data-action="close" aria-label="닫기">${ICON.close}</button><h2 id="sheet-title">장소 월드컵</h2><span style="width:40px"></span></div>`;
  const groups = cupGroups();
  if (!groups.length) {
    return `${head}<div class="sheet-body">${cupTabs()}<div class="empty-state"><strong>아직 기록이 없어요</strong>월드컵을 끝까지 하면 여기에 남고, 1위 장소엔 도장이 찍혀요.</div></div>`;
  }
  // 최근 연도부터, 전체 기간은 맨 아래. 한 해 안에서는 종합 → 카테고리 순서
  const catPos = (c) => (c === '전체' ? -1 : catNames().indexOf(c));
  const years = [...new Set(groups.map((g) => g.year))].sort((a, b) => (a === 'all' ? 1 : b === 'all' ? -1 : Number(b) - Number(a)));
  const sections = years.map((y) => `<h3 class="rec-year">${y === 'all' ? '전체 기간' : `${y}년`}</h3>${groups
    .filter((g) => g.year === y).sort((a, b) => catPos(a.cat) - catPos(b.cat)).map(recCard).join('')}`).join('');
  return `${head}<div class="sheet-body">${cupTabs()}
    <p class="hint" style="margin:0">각자 고른 1위엔 그 사람 색 도장이 찍혀요.</p>
    ${sections}
  </div>`;
}

/* ---------- 카테고리 (방 멤버가 함께 씀) ---------- */
async function addCategory(btn) {
  const box = btn.closest('.new-cat'), input = box.querySelector('input');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  if (name === '전체') { toast('‘전체’는 카테고리 이름으로 쓸 수 없어요.'); return; }
  if (!catNames().includes(name)) {
    const position = Math.max(0, ...state.categories.map((c) => c.position)) + 1;
    const { data, error } = await sb.from('categories').insert({ couple_id: state.roomId, name, position }).select('id, name, position').single();
    if (error) throw error;
    state.categories.push(data);
    toast(`‘${name}’ 카테고리를 추가했어요.`);
  }
  input.value = '';
  render();
  const form = btn.closest('#place-form');
  if (!form) { renderSheet(); return; }
  // 장소 폼은 쓰던 내용이 날아가지 않게 다시 그리지 않고 칩만 끼워 넣어 골라 둠
  const pick = form.querySelector('.cat-pick');
  if (![...pick.querySelectorAll('[data-action=pick-cat]')].some((b) => b.dataset.cat === name)) {
    pick.querySelector('[data-action=new-cat]').insertAdjacentHTML('beforebegin', catChip(name, false));
  }
  selectCat(form, name);
  box.classList.add('hidden');
}
async function renameCategory(input) {
  const cat = state.categories.find((c) => c.id === input.dataset.catId);
  if (!cat) return;
  const name = input.value.trim();
  if (name === cat.name) { input.value = name; return; }
  if (!name || name === '전체') {
    input.value = cat.name;
    toast(name ? '‘전체’는 카테고리 이름으로 쓸 수 없어요.' : '카테고리 이름을 입력해 주세요.');
    return;
  }
  const { error } = await sb.from('categories').update({ name }).eq('couple_id', state.roomId).eq('id', cat.id);
  if (error) { input.value = cat.name; throw error; }
  if (state.category === cat.name) state.category = name;

async function moveCategory(id, dir) {
  const list = [...state.categories];
  const i = list.findIndex((c) => c.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  // 순서를 0부터 다시 매기고 바뀐 것만 저장
  const changed = list.map((c, k) => [c, k]).filter(([c, k]) => c.position !== k);
  const res = await Promise.all(changed.map(([c, k]) => sb.from('categories').update({ position: k }).eq('couple_id', state.roomId).eq('id', c.id)));
  const bad = res.find((r) => r.error);
  if (bad) throw bad.error;
  state.categories = list.map((c, k) => ({ ...c, position: k }));
  renderSheet(); render();
  const again = $(`#sheet-root [data-action=cat-move][data-id="${id}"][data-dir="${dir}"]`);

async function deleteCategory(id) {
  const cat = state.categories.find((c) => c.id === id);

  const used = state.places.filter((x) => x.category === cat.name).length;
  if (used) { toast(`‘${cat.name}’에 장소가 ${used}곳 있어요. 장소의 카테고리를 먼저 바꿔 주세요.`); return; }
  if (state.categories.length === 1) { toast('카테고리는 하나 이상 있어야 해요.'); return; }
  // 그 카테고리 월드컵 기록은 DB에서 같이 지워짐 (도장도 사라짐)
  const cups = cupGroups().filter((g) => g.cat === cat.name).length;
  if (!confirm(`‘${cat.name}’ 카테고리를 삭제할까요?${cups ? ` ${cat.name} 월드컵 기록 ${cups}개와 도장도 같이 지워져요.` : ''}`)) return;
  const { error } = await sb.rpc('trash_item', { p_kind: 'category', p_id: id });
  if (error) throw error;
  state.categories = state.categories.filter((c) => c.id !== id);
  state.cupResults = state.cupResults.filter((r) => r.category !== cat.name);
  if (state.category === cat.name) state.category = '전체';
  renderSheet(); render();
  toast('카테고리를 삭제했어요.');
}

/* ---------- 시트: 내 정보 (방·멤버·초대 코드·닉네임·색·방 바꾸기·카테고리, 계정 설정으로 가는 줄, 맨 아래 나가기) ---------- */
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// 직접 고르기 칸: null이면 닫힘, 문자열이면 열려 있고 그 값(색 코드 칸에 적힌 그대로)

function customCheck(raw) {
  const hex = normHex(raw);
  if (!hex && /^#?[0-9a-f]{0,5}$/i.test(String(raw || '').trim())) return { hex: null, level: 'pending', msg: '# 뒤에 6자리 색 코드를 입력해 주세요. (예: #FF7A00)' };
  if (!hex) return { hex: null, level: 'error', msg: '색 코드는 #RRGGBB처럼 # 뒤에 6자리로 입력해 주세요. (예: #FF7A00)' };
  const me = myMember();
  // 처음 열면 지금 팔레트 색(밝은 값)이 들어 있음: 그대로 저장하면 팔레트 색이 직접 고른 색으로 바뀌어 어두운 화면 값을 잃으니 '지금 내 색'으로 봄
  const mine = me && !isHexColor(me.color) ? colorFills(me.color) : null;
  if (me && (me.color === hex || (mine && mine.includes(hex)))) return { hex, level: 'same', msg: '지금 내 색이에요. 바꾸려면 색 판이나 색 코드로 다른 색을 골라 주세요.' };
  let near = null, d = Infinity;
  for (const m of otherMembers()) { const x = colorDistance(m.color, hex); if (x != null && x < d) { d = x; near = m; } }
  const who = near && esc(near.display_name || '멤버');
  if (near && d < COLOR_BLOCK) return { hex, level: 'error', near, msg: `${who}님 색과 거의 같아요. 조금 다른 색을 골라 주세요.` };
  if (near && d < COLOR_WARN) return { hex, level: 'warn', near, msg: `${who}님 색과 비슷해요. 그래도 저장할 수 있어요.` };

      <p class="hint">이 기기에서만 로그아웃돼요. 다시 들어올 때는 ${id ? '아이디와' : '이메일과'} 비밀번호가 필요해요.</p>
    </div>
    <p class="app-version">${esc(APP_VERSION)}</p>
  </div>`;
}

/* ---------- 공개 방 (멤버 쪽): 둘러보기 링크, 초대 코드 다시 만들기, 한 번 알림 ---------- */
// 지금 방의 둘러보기 링크 /r/<공개 키>. 공유 창이 있으면 그것, 없거나 실패하면 복사 (공유 창을 그냥 닫은 것은 그대로 둠)
async function shareLink() {
  const r = state.couple;
  if (!r || !isPublicRoom(r) || !PUBLIC_KEY_RE.test(String(r.public_key || ''))) return;
  const url = `${location.origin}/r/${r.public_key}`;
  if (navigator.share) {
    try { await navigator.share({ title: r.name, url }); return; } catch (x) { if (x && x.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('둘러보기 링크를 복사했어요.'); } catch { toast(url, 6000); }
}
// 방장만 (모든 방, 최종 결정 7). 예전 코드는 바로 못 쓰게 되고, 이미 들어온 멤버는 그대로
async function regenCode(btn) {
  const roomId = state.roomId;
  if (!state.couple || !isOwner()) return;
  if (!confirm('초대 코드를 새로 만들까요? 지금 코드는 바로 못 쓰게 되고, 아직 안 들어온 친구에게는 새 코드를 다시 보내야 해요. 이미 들어온 멤버는 그대로예요.')) return;
  await busy(btn, async () => {
    const { data, error } = await sb.rpc('regenerate_invite_code', { p_couple: roomId });
    if (error) { toast(friendly(error)); return; }
    // 다시 불러오기 전에 받은 코드부터 바로 보이게 (메인의 초대 띠·내 정보 모두 state.couple을 읽음)
    const room = state.rooms.find((r) => r.id === roomId);
    if (room && typeof data === 'string' && /^[0-9A-F]{8}$/.test(data)) room.invite_code = data;
    if (state.roomId === roomId) { render(); if (state.sheet && state.sheet.type === 'settings') renderSheet(); }
    try { await refresh(); } catch { /* 받은 코드로 이미 보임 */ }
    if (state.sheet && state.sheet.type === 'settings') renderSheet();
    toast('새 초대 코드를 만들었어요.');
  });
}
// 로그인 뒤 한 번만: 공개 방이 생겼다는 알림 (방이 있는 사람에게만, §4.11 흐름 E)
function publicNotice() {
  if (!PUBLIC_ROOMS_ENABLED || !state.user || !state.rooms.length || state.visit) return;
  try { if (localStorage.getItem(NOTICE_KEY)) return; localStorage.setItem(NOTICE_KEY, '1'); } catch { return; } // 못 남기면 매번 뜨니 아예 안 띄움
  toast('새 기능: 공개 방. 지금 방은 그대로 개인 방이에요. 방 선택 화면이나 방 이름(⌄)의 돋보기로 둘러볼 수 있어요.', 5000);
}

/* ---------- 나가기 ---------- */
// 멤버가 남아 있으면 내 후기·월드컵 기록만 지우고 나감(방장이면 가장 먼저 들어온 멤버가 방장).
// 혼자 남았으면 방과 연결 기록을 비공개 휴지통으로 옮기고 서버가 3일 뒤 사진부터 정리
async function leaveRoom(btn) {
  const start = state.roomId;
  try { await refresh(); } catch { /* 지금 아는 멤버 수로 진행 (DB가 다시 확인함) */ }
  const room = state.couple;
  if (!room || room.id !== start) return; // 그사이 방이 바뀜
  const roomId = room.id, name = room.name;
  const alone = state.members.length <= 1, pub = isPublicRoom(room);
  if (alone) {
    if (!confirm(pub
      ? `‘${name}’에서 나가면 이 공개 방과 둘러보기 링크가 사라져요. 장소·사진·후기·월드컵 기록이 화면에서 사라지고, 서버의 비공개 보관함에서 3일 뒤 영구 삭제돼요.`
      : `‘${name}’에서 나가면 방이 없어져요. 장소·사진·후기·월드컵 기록이 화면에서 사라지고, 서버의 비공개 보관함에서 3일 뒤 영구 삭제돼요.`)) return;
    if (!confirm(`정말 ‘${name}’ 방을 지울까요?`)) return;
  } else if (!confirm(`‘${name}’에서 나갈까요? 내가 남긴 후기와 월드컵 기록은 지워지고, 내가 담은 장소와 사진은 방에 남아요.${isOwner() ? ' 방장은 가장 먼저 들어온 멤버에게 넘어가요.' : ''}`
    // 공개 방: 남는 장소·사진은 계속 공개되고 '예전 멤버'로 보임 (§4.11)
    + (pub ? ' 공개 방이라 내가 담은 장소와 올린 사진은 남아 계속 공개되고, 공개 화면에는 ‘예전 멤버’로 보여요. 내리고 싶은 사진은 나가기 전에 지워 주세요.' : ''))) return;
  await busy(btn, async () => {
    if (alone) {
      // 이때부터 15분 동안 이 방 코드로는 들어올 수 없음 (마지막 멤버 삭제 확인과 실행 사이 참여 방지)
      const { error } = await sb.rpc('begin_room_delete', { p_couple: roomId });
      if (error) {
        toast(friendly(error));
        if (/not_last_member/.test(error.message || '')) await refresh().catch(() => {});
        return;
      }

    }
    const { data, error } = await sb.rpc('leave_room', { p_couple: roomId });
    if (error) {
      // 그사이 다른 멤버가 모두 나가 혼자 남음: 방을 지우는 것은 한 번 더 확인받은 뒤에만 (DB가 막음)
      if (/last_member/.test(error.message || '') && !/not_last_member/.test(error.message || '')) {
        toast('그사이 다른 멤버가 모두 나갔어요. 다시 확인해 주세요.');
        await refresh().catch(() => {});
        return;
      }
      throw error;
    }
    // 그 방은 이제 내 방이 아님: 기억해 둔 방에서 빼고 남은 방으로 (1개면 그 방, 2개 이상이면 방 고르기, 0개면 시작하기)
    if (lastRoom() === roomId) rememberRoom(null);
    state.rooms = state.rooms.filter((r) => r.id !== roomId);
    state.allMembers = state.allMembers.filter((m) => m.couple_id !== roomId);
    state.roomId = null;
    resetRoomView();
    forcePicker = false;
    state.roomId = chooseRoom(); // 1개 남았으면 바로 그 방(불러오는 중 화면), 0개·2개 이상이면 시작하기·방 고르기
    applyRoom();
    render();
    toast(data && data.room_deleted ? '방을 지웠어요.' : '방에서 나왔어요.');
    try { await refresh({ keepSheet: false }); } catch (err) { toast(friendly(err)); }
  });
}

/* readOnly */
/* ---------- 공개 방: 둘러보기와 읽기 전용 보기 (docs/public-rooms-design.md §4.2–4.6, §4.12) ----------
   여기부터 아래 '/readOnly' 표시까지는 둘러보는 사람에게만 그리는 것이라 방 초대 정보·찜·고치는 단추를 넣지 않는다(시험이 확인).
   서버(GET /api/public/*)가 준 값은 모두 아래 정리 함수를 거쳐 모양·길이를 맞추고, 화면에 넣을 때는 esc()·safeUrl()·imgUrl()을 거친다. */
// 읽기 전용에서 누를 수 있는 것만. click 위임 맨 앞에서 이 목록 밖의 data-action은 아무 일도 하지 않음 (§4.2)
const VISIT_ACTIONS = ['visit-close', 'visit-retry', 'tab', 'cat', 'sort', 'clear-search', 'open', 'close', 'view-photo', 'close-viewer', 'copy-open', 'copy-room', 'copy-status', 'copy-save', 'copy-create', 'explore-back'];
// 'YYYY-MM' → '2026년 9월' (공개 방은 날짜를 월까지만 줌)
const fmtMonth = (m) => { const x = /^(\d{4})-(\d{2})/.exec(String(m || '')); return x ? `${x[1]}년 ${Number(x[2])}월` : ''; };
const pubStr = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
const pubCount = (v) => (Number.isInteger(v) && v >= 0 ? v : 0);
const MONTH_RE = /^\d{4}-\d{2}$/;
const MEMBER_NO_RE = /^m[1-5]$/; // 응답 안에서만 쓰는 멤버 번호
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const pp = (w, a, b) => josa(w, a, b).slice(String(w).length); // 조사만: pp('라멘', '과', '와') → '과'
// 사진 주소: 홈 서버가 서명해 넘겨주는 같은 사이트의 /api/public/img/…(public.cjs, 서버는 https://<사이트>/…로 줌), 개발용 http://localhost,
// 작은 data: 그림(가짜 Supabase)만. Supabase 서명 주소는 받지 않음(저장소 응답 헤더에 업로드 시각이 드러나서 서버가 대신 받아 넘김)
const PUBLIC_IMG_RE = /^\/api\/public\/img\/\d{10}\.[A-Za-z0-9_-]{43}\/[0-9a-f-]{36}\/(t\/)?[0-9a-f-]{32,36}\.jpg$/;
function imgUrl(u) {
  const s = String(u || '');
  if (PUBLIC_IMG_RE.test(s)) return s;
  if (/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(s)) return s;
  try {
    const x = new URL(s);
    if (x.origin === location.origin && PUBLIC_IMG_RE.test(x.pathname) && x.href === x.origin + x.pathname) return x.pathname;
    return x.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(x.hostname) ? x.href : '';
  } catch { return ''; }
}
// 공개 방 지도 링크: 아는 지도 주소(네이버·구글·카카오)만 (서버 public.cjs mapUrl과 같은 규칙). 아니면 null → 네이버 지도 검색 링크로.
// 남이 넣은 낚시 주소가 '네이버 지도에서 보기'로 보이거나 '내 방에 담기'로 내 방에 들어오지 않게
function publicMapUrl(v) {
  let u;
  try { u = new URL(String(v || '')); } catch { return null; }
  if (!/^https?:$/.test(u.protocol) || u.username || u.password || u.port || String(v).length > 2000) return null;
  const h = u.hostname;
  const ok = /^(naver\.me|(m\.)?map\.naver\.com|(m\.|pcmap\.)?place\.naver\.com|maps\.app\.goo\.gl|kko\.to|(place\.|m\.)?map\.kakao\.com)$/.test(h)
    || (h === 'goo.gl' && /^\/maps(\/|$)/.test(u.pathname))
    || (/^(www\.|maps\.)?google\.(com|[a-z]{2}|co\.[a-z]{2}|com\.[a-z]{2})$/.test(h) && (h.startsWith('maps.') || /^\/maps(\/|$)/.test(u.pathname)));
  if (!ok) return null;
  u.protocol = 'https:';
  return u.href;
}
// 홈 서버의 공개 API (GET, 지금 로그인 토큰을 붙임). 실패해도 던지지 않고 { ok, status, body }
async function getPublic(path) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  try {
    const { data } = await sb.auth.getSession();
    const token = data.session && data.session.access_token;
    const r = await fetch(path, { signal: ctl.signal, headers: token ? { authorization: `Bearer ${token}` } : {} });
    const j = await r.json().catch(() => null);
    return { ok: r.ok, status: r.status, body: j && typeof j === 'object' ? j : {} };
  } catch { return { ok: false, status: 0, body: {} }; }
  finally { clearTimeout(timer); }
}
// 서버 오류 문구는 로그인·횟수 제한일 때만 그대로 보여 줌. 나머지는 정해진 문구
const pubError = (r) => ([401, 429].includes(r.status) ? pubStr(r.body.error, 200) : '');

/* 받은 방 JSON → 기존 장소 모양 (§4.2 visitPlace). 날짜는 'YYYY-MM' 그대로(lastDay·정렬이 같은 꼴끼리 비교), 찜은 늘 false */
function visitPlace(x) {
  if (!x || typeof x !== 'object' || !UUID_RE.test(String(x.id))) return null;
  const visits = (Array.isArray(x.visits) ? x.visits : []).filter((v) => v && MONTH_RE.test(v.month)).map((v, vi) => ({
    id: `${x.id}:${vi}`,
    visited_on: v.month,
    // 나간 사람(by: null)의 후기는 줄마다 따로 '예전 멤버'로 (같은 줄로 합치지 않게 번호를 붙임)
    reviews: (Array.isArray(v.reviews) ? v.reviews : []).filter((r) => r && typeof r === 'object').map((r, ri) => ({
      author_id: MEMBER_NO_RE.test(r.by) ? r.by : `gone-${vi}-${ri}`,
      rating: typeof r.rating === 'number' && r.rating > 0 && r.rating <= 5 ? r.rating : null,
      body: pubStr(r.body, 3000),
    })),
  }));
  const photos = (Array.isArray(x.photos) ? x.photos : []).slice(0, 3).map((ph, i) => ({ thumb: imgUrl(ph && ph.thumb_url), i }));
  return {
    id: x.id, name: pubStr(x.name, 80) || '이름 없는 장소', category: pubStr(x.category, 20) || '기타', address: pubStr(x.address, 200) || null,
    naver_url: publicMapUrl(x.map_url), status: x.status === 'visited' ? 'visited' : 'want_to_go', favorite: false,
    shared_note: pubStr(x.shared_note, 2000), created_by: MEMBER_NO_RE.test(x.added_by) ? x.added_by : null,
    created_at: MONTH_RE.test(x.added_month) ? x.added_month : '',
    visits, reviews: visits.flatMap((v) => v.reviews), photos, photoCount: Math.max(pubCount(x.photo_count), photos.length),
  };
}
function visitData(d) {
  const members = (Array.isArray(d.members) ? d.members : []).filter((m) => m && MEMBER_NO_RE.test(m.m))
    .map((m, i) => ({ user_id: m.m, display_name: pubStr(m.name, 20) || '멤버', color: typeof m.color === 'string' ? m.color : null, role: 'member', created_at: String(i) }));
  return {
    data: {
      name: pubStr(d.name, 30) || '공개 방', description: pubStr(d.description, PUBLIC_DESC_MAX),
      truncated: d.truncated === true, photos_paused: d.photos_paused === true,
      categories: (Array.isArray(d.categories) ? d.categories : []).filter((c) => typeof c === 'string' && c).map((c) => c.slice(0, 20)),
    },
    members,
    places: d.places.map(visitPlace).filter(Boolean),
  };
}

/* 읽기 전용 화면 조각 (viewMain·detailView가 부름) */
function visitBand() {
  return `<div class="visit-band"><span>${state.visit.from === 'self' ? '방문자에게 보이는 모습' : '둘러보는 중'} · 읽기 전용</span><button class="text-btn" data-action="visit-close">닫기</button></div>`;
}
// 머리: 방 이름(버튼 아님) + 공개 표시, 소개, 멤버 칩. 오른쪽 아이콘 없음
function visitHeadHtml(duo) {
  const d = state.visit.data;
  return `${visitBand()}
      <div class="top-row"><div class="top-head">
        <h1 class="title">${esc(d.name)}${pubBadge}</h1>
        ${d.description ? `<p class="visit-desc">${esc(d.description)}</p>` : ''}
        ${duo}
      </div></div>`;
}
function visitNotesHtml() {
  const d = state.visit.data;
  return (d.truncated ? '<p class="visit-note">앱에서는 300곳까지만 보여요.</p>' : '')
    + (d.photos_paused ? '<p class="visit-note">지금은 사진 보기가 잠시 멈췄어요. 나중에 다시 보여요.</p>' : '');
}
// 불러오는 중 / 없는 방 / 실패
function visitStateView() {
  const v = state.visit;
  const body = v.status === 'loading' ? '<div class="empty-state">불러오는 중…</div>'
    : v.status === 'gone' ? `<div class="empty-state"><strong>이 공개 방을 찾을 수 없어요</strong>지워졌거나 지금은 볼 수 없는 방이에요.<div style="margin-top:16px"><button class="btn small ghost" data-action="visit-close">닫기</button></div></div>`
    : `<div class="empty-state"><strong>지금은 공개 방을 불러올 수 없어요</strong>${esc(v.error || '잠시 후 다시 시도해 주세요.')}<div style="margin-top:16px"><button class="btn small" data-action="visit-retry">다시 시도</button></div></div>`;
  return `<div class="top"><div class="wrap">${visitBand()}</div></div><main class="wrap">${body}</main>`;
}
// 상세 머리: 닫기 + (하트·정보 수정 자리에) '내 방에 담기' 하나
function visitDetailHead() {
  return `<div class="sheet-head">
      <button class="icon-btn" data-action="close" aria-label="닫기">${ICON.close}</button>
      <div class="right"><button class="text-btn" data-action="copy-open" style="padding-right:10px;color:var(--p1-ink)">내 방에 담기</button></div>
    </div>`;
}
// 상세 아래쪽: 상태(누를 수 없음), 함께 쓰는 메모(있을 때만), 방문 기록(있을 때만), 담은 사람·달
function visitDetailBody(p) {
  const by = person(p.created_by), month = fmtMonth(p.created_at);
  return `<div class="seg" role="group" aria-label="방문 상태">
        <span aria-current="${p.status === 'want_to_go'}">가고 싶은 곳</span>
        <span aria-current="${p.status === 'visited'}">다녀왔어요</span>
      </div>
      ${p.shared_note ? `<section class="block"><h3>함께 쓰는 메모</h3><p class="note-text">${esc(p.shared_note)}</p></section>` : ''}
      ${p.visits.length ? `<section class="block">
        <div class="block-head"><h3>방문 기록<span class="n">${p.visits.length}</span></h3></div>
        ${p.visits.map((v) => visitCard(p, v, false)).join('')}
      </section>` : ''}
      <div class="danger-zone"><span class="by ${by.cls}"><i class="dot"></i><span>${p.created_by ? `${esc(josa(by.name, '이', '가'))} ${month ? `${esc(month)}에 ` : ''}담음` : '예전 멤버가 담음'}</span></span></div>`;
}
// 상세 사진: 썸네일(없거나 한도가 찼으면 회색 자리). 4장째부터는 '사진 N장 더 있어요'
function visitGalleryHtml(p) {
  if (!p.photos.length) return '';
  const many = p.photos.length > 1, more = p.photoCount - p.photos.length;
  return `<div class="gallery">
    <div class="gallery-track" id="gallery">${p.photos.map((ph, i) => `<button type="button" class="gallery-item" data-action="view-photo" data-i="${i}" aria-label="사진 ${i + 1} 크게 보기">
      ${ph.thumb ? `<img src="${esc(ph.thumb)}" alt="${esc(p.name)} 사진 ${i + 1}"${i ? ' loading="lazy"' : ''}>` : '<span class="photo-ph" aria-hidden="true"></span>'}</button>`).join('')}</div>
    ${many ? `<span class="gallery-count" id="gallery-count" aria-live="polite">1 / ${p.photos.length}</span>` : ''}
  </div>${more > 0 ? `<p class="hint" style="margin:0 0 4px">사진 ${more}장 더 있어요</p>` : ''}`;
}
// 크게 보기: 먼저 썸네일로 띄우고, 누른 사진만 큰 사진 URL(10분)을 받아 바꿔 넣음. 받은 URL은 8분 동안 다시 씀
const visitLarge = new Map(); // '<키>|<장소 id>|<번호>' → { url, at }
function openVisitViewer(p, i) {
  const key = state.visit.key;
  const big = (k) => { const c = visitLarge.get(`${key}|${p.id}|${k}`); return c && Date.now() - c.at < 8 * 60e3 ? c.url : ''; };
  const item = (ph, k) => { const src = big(k) || ph.thumb; return src ? `<img src="${esc(src)}" alt="${esc(p.name)} 사진 ${k + 1}">` : '<span class="photo-ph" aria-hidden="true"></span>'; };
  const root = $('#viewer-root');
  root.innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="${esc(p.name)} 사진">
    <div class="viewer-track" id="viewer-track">${p.photos.map((ph, k) => `<div class="viewer-item" data-i="${k}">${item(ph, k)}</div>`).join('')}</div>
    <button class="icon-btn viewer-close" data-action="close-viewer" aria-label="닫기">${ICON.close}</button>
    ${p.photos.length > 1 ? `<span class="viewer-count" id="viewer-count">${i + 1} / ${p.photos.length}</span>` : ''}
  </div>`;

}
async function loadLargePhoto(p, i) {
  const v = state.visit;
  const r = await getPublic(`/api/public/rooms/${encodeURIComponent(v.key)}/photo?place=${encodeURIComponent(p.id)}&i=${i}`);
  if (state.visit !== v) return;
  const url = r.ok ? imgUrl(r.body.url) : '';
  if (!url) { toast(pubStr(r.body.error, 200) || '사진을 불러오지 못했어요.'); return; }
  visitLarge.set(`${v.key}|${p.id}|${i}`, { url, at: Date.now() });
  const box = $(`#viewer-track [data-i="${i}"]`);
  if (box) box.innerHTML = `<img src="${esc(url)}" alt="${esc(p.name)} 사진 ${i + 1}">`;

/* 썸네일: 방 응답에는 장소마다 대표 하나만 오고, 2·3번째는 상세를 열 때 /thumbs로 받음 (서버가 사람마다 하루 한도를 셈).
   받은 URL은 '<장소 id>|<번호>' → { url, at }로 기억해 다시 받은 방 응답에 null이 와도 25분 동안은 그대로 씀
   (서버는 30분 이상 남은 URL만 주므로 그 안에는 만료되지 않음). 보이던 사진이 회색으로 바뀌지 않게 */
const THUMB_KEEP_MS = 25 * 60e3;
function keepThumbs(v) {
  const t = Date.now();
  for (const p of v.places) {
    p.photos.forEach((ph, i) => {
      const k = `${p.id}|${i}`, c = v.thumbs.get(k);
      if (ph.thumb) { if (!c || c.url !== ph.thumb) v.thumbs.set(k, { url: ph.thumb, at: t }); }
      else if (c && t - c.at < THUMB_KEEP_MS) ph.thumb = c.url;
    });
  }
}
async function loadVisitThumbs(id) {
  const v = state.visit;
  if (!v || v.status !== 'ok') return;
  const p = v.places.find((x) => x.id === id);
  const asked = v.thumbsAsked.get(id);
  if (!p || p.photos.length < 2 || p.photos.every((ph) => ph.thumb) || (asked && Date.now() - asked < THUMB_KEEP_MS)) return;
  v.thumbsAsked.set(id, Date.now());
  const r = await getPublic(`/api/public/rooms/${encodeURIComponent(v.key)}/thumbs?place=${encodeURIComponent(id)}`);
  if (state.visit !== v) return;
  if (!r.ok || !Array.isArray(r.body.thumbs)) { v.thumbsAsked.delete(id); return; }
  const t = Date.now();
  r.body.thumbs.slice(0, 3).forEach((u, i) => { const url = imgUrl(u); if (url) v.thumbs.set(`${id}|${i}`, { url, at: t }); });
  keepThumbs(v);
  // 열려 있는 상세의 회색 자리만 사진으로 바꿈 (넘기던 위치는 그대로)
  const cur = v.places.find((x) => x.id === id), track = $('#gallery');
  if (!cur || !track || !state.sheet || state.sheet.type !== 'detail' || state.sheet.id !== id) return;
  cur.photos.forEach((ph, i) => {
    const b = track.querySelector(`[data-i="${i}"]`);
    if (b && ph.thumb && !b.querySelector('img')) b.innerHTML = `<img src="${esc(ph.thumb)}" alt="${esc(cur.name)} 사진 ${i + 1}" loading="lazy">`;
  });
}

/* 읽기 전용 보기 열기·닫기 (§4.4). 마지막 방(ROOM_KEY)은 바꾸지 않음 */
function openVisit(key, from) {
  if (!PUBLIC_KEY_RE.test(String(key || ''))) { toast('이 공개 방을 찾을 수 없어요.'); return; }
  // 내 방이면 둘러보기 대신 그 방으로 ('방문자에게 보이는 모습'만 예외)
  const mine = state.rooms.find((r) => r.public_key === key);
  if (mine && from !== 'self') {
    if (state.explore) closeExplore({ reload: false });
    switchRoom(mine.id).catch((err) => toast(friendly(err)));
    return;
  }
  if (state.explore && from === 'explore') state.explore.scroll = window.scrollY;
  loadGen++; // 늦게 끝난 내 방 불러오기가 이 화면을 덮지 않게 (닫을 때 다시 불러옴)
  cancelGoogle();
  state.sheet = null;
  $('#viewer-root').innerHTML = '';
  drawSheet();
  state.visit = { key, from, status: 'loading', data: null, members: [], places: [], error: '', tab: 'visited', sort: 'rating', category: '전체', query: '',
    loadedAt: 0, thumbs: new Map(), thumbsAsked: new Map() };

  syncHistory();

}
// silent: 다른 앱에 다녀왔을 때 다시 받기. 이미 받은 화면이 있으면 실패해도 그대로 두고 알림만
async function loadVisit(silent = false) {
  const v = state.visit;
  if (!v) return;
  if (!silent) { v.status = 'loading'; render(); }
  const r = await getPublic(`/api/public/rooms/${encodeURIComponent(v.key)}`);
  if (state.visit !== v) return; // 그사이 닫았거나 다른 방을 엶
  const d = r.body;
  if (r.ok && (d.key == null || d.key === v.key) && Array.isArray(d.places)) {
    const first = !v.data;
    Object.assign(v, visitData(d), { status: 'ok', error: '', loadedAt: Date.now() });
    keepThumbs(v);
    // 기본은 '다녀온 곳'이지만, 처음 열었는데 다녀온 곳이 하나도 없으면 '가고 싶은 곳'부터 (빈 화면 대신)
    if (first && !v.places.some((p) => p.status === 'visited') && v.places.length) v.tab = 'want_to_go';
    if (v.category !== '전체' && !v.data.categories.includes(v.category) && !v.places.some((p) => p.category === v.category)) v.category = '전체';

    return;

    v.status = r.status === 404 ? 'gone' : 'error';
    v.error = pubError(r);
  }
  if (v.status !== 'ok' && state.sheet) { state.sheet = null; $('#viewer-root').innerHTML = ''; drawSheet(); }
  render();
  if (state.sheet && state.sheet.type === 'detail') { drawSheet(); loadVisitThumbs(state.sheet.id); } // 다시 받은 내용으로
  syncHistory({ push: false });
}

/* 둘러보기 화면 (§4.3). 검색은 받은 목록을 이 폰에서만 거름 (서버로 보내지 않음) */
function exploreRoom(x) {

}

function exploreHintSeen() { try { return localStorage.getItem(EXPLORE_HINT_KEY) === '1'; } catch { return false; } }

async function loadExplore() {

// 닫으면 원래 화면(방 고르기·시작하기·메인)으로. 그사이 바뀌었을 수 있는 내 방을 다시 받음

/* /r/<key> 링크 (§4.12): 시작할 때 키를 sessionStorage에 두고 주소는 '/'로. 로그인하고 첫 불러오기가 끝나면 엶 */
function pendingKey() {
  try { const k = sessionStorage.getItem(PENDING_KEY); return k && PUBLIC_KEY_RE.test(k) ? k : null; } catch { return null; }
}
function takePending() {
  const key = pendingKey();
  try { sessionStorage.removeItem(PENDING_KEY); } catch { /* 다음에 한 번 더 열릴 뿐 */ }
  if (!key || !state.user) return;
  if (!PUBLIC_ROOMS_ENABLED) { toast('지금은 공개 방을 볼 수 없어요.'); return; }
  openVisit(key, 'direct');
}

/* 내 방에 담기 (시트 copy, §4.8 · 최종 결정 2): 둘러보는 방의 장소 하나를 내가 든 방에 새 장소로 넣음.

function openCopy(placeId) {

}

// 같은 장소인지 볼 때: 앞뒤 공백 빼고, 공백 여러 개는 하나로, 소문자
const placeKey = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
// 담을 카테고리: 원래 이름이 그 방에 있으면 그것 → '기타' → 맨 아래(position이 가장 큰) 카테고리 → 하나도 없으면 '기타'를 만듦
async function copyCategory(target, want) {
  const { data, error } = await sb.from('categories').select('name, position').eq('couple_id', target).order('position');
  if (error) throw error;
  const list = data || [];
  if (list.some((c) => c.name === want)) return want;

  if (e.target.id === 'custom-color') syncCustom(e.target.value, 'well');
  if (e.target.id === 'custom-hex') syncCustom(e.target.value, 'hex');
  // 휴대폰 키보드의 클립보드 버튼은 paste 이벤트 없이 글자를 넣으므로 여기서도 정리
  if (e.target.name === 'naver_url') {
    const form = e.target.form, v = e.target.value;
    if (googleJob && googleJob.form === form && googleKey(v) !== googleJob.url) cancelGoogle(); // 묻는 중에 링크를 바꿈
    if (isShareText(v)) applyShare(form, v);
    // 링크만 넣은 구글 지도 링크: 붙여넣기(키보드의 클립보드 버튼 포함)는 바로, 손으로 치는 중이면 잠깐 기다렸다가
    else if (isGoogleMaps(v.trim())) {
      clearTimeout(googleTimer);
      if (e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText' || (e.data && e.data.length > 8)) fillFromGoogle(form);
      else googleTimer = setTimeout(() => fillFromGoogle(form), 400);
    }
  }
});

// 검색어 지우기 ✕를 눌러도 검색창에 있던 커서(키보드)는 그대로 (없었으면 키보드를 새로 띄우지도 않음)
document.addEventListener('mousedown', (e) => { if (e.target.closest('.search-clear')) e.preventDefault(); });

document.addEventListener('paste', (e) => {
  const form = e.target.form;
  if (!form || form.id !== 'place-form' || !['naver_url', 'name', 'address'].includes(e.target.name)) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!isShareText(text)) return; // 링크만, 혹은 일반 글자만 붙여넣은 경우는 그대로
  e.preventDefault();
  if (!applyShare(form, text)) toast('링크와 이름·주소를 채웠어요.'); // 구글 지도는 알림을 따로 띄움
});

document.addEventListener('change', async (e) => {
  if (e.target.id === 'visit-date') keepReviewDraft();
  const t = e.target;
  if (ro()) return; // 읽기 전용: 사진 올리기·카테고리 이름 바꾸기 없음
  // 방 만들기: 개인/공개 고르기, '이해했어요' 체크
  if (t.form && t.form.id === 'room-form' && (t.name === 'visibility' || t.name === 'ack')) { syncVisibility(t.form); return; }
  if (t.name === 'photo' && t.form && t.form.id === 'place-form') {
    // 고른 사진 미리보기 (최대 장수까지, 첫 장에 '대표')
    const box = $('#photo-previews');
    box.querySelectorAll('img').forEach((img) => URL.revokeObjectURL(img.src));
    const files = [...t.files];
    box.innerHTML = files.slice(0, MAX_PHOTOS).map((f, i) => `<span class="photo-preview"><img src="${URL.createObjectURL(f)}" alt="고른 사진 ${i + 1}">${i ? '' : '<span class="cover-badge">대표</span>'}</span>`).join('');
    $('#photo-hint').textContent = files.length > MAX_PHOTOS
      ? `사진은 ${MAX_PHOTOS}장까지라 ${files.length - MAX_PHOTOS}장은 빠져요.`
      : `처음 고른 사진이 대표 사진이에요. 최대 ${MAX_PHOTOS}장.`;
  }
  if (t.dataset.catId) {
    try { await renameCategory(t); } catch (err) { toast(friendly(err)); }
  }
  if (t.id === 'photo-input' && t.files.length) {
    const p = state.sheet && state.places.find((x) => x.id === state.sheet.id);
    if (!p) return;
    const before = p.photos.length;
    const r = await addPhotos(p, t.files, (k, n) => toast(n > 1 ? `사진을 올리는 중… (${k}/${n})` : '사진을 올리는 중…', 0));
    if (r.done) state.photoIdx = before; // 새로 올린 첫 사진을 보여 줌
    try { await refresh(); } catch (err) { toast(friendly(err)); return; }
    toast(photoResultText(r), r.error || r.skipped ? 6000 : 2200);
  }
});

document.addEventListener('keydown', (e) => {
  // Esc: 크게 보던 사진이 있으면 그것만 닫음
  if (e.key === 'Escape' && closeViewer()) { e.preventDefault(); return; }
  if (e.key === 'Escape' && state.sheet) { e.preventDefault(); $('[data-action=close]', $('#sheet-root')).click(); }
  // 시트가 없으면 읽기 전용 보기 → 둘러보기 순서로 닫음
  else if (e.key === 'Escape' && state.visit) { e.preventDefault(); closeVisit(); }
  else if (e.key === 'Escape' && state.explore) { e.preventDefault(); closeExplore(); }
  // 카테고리 입력칸의 Enter는 장소 폼 제출 대신 추가 / 이름 바꾸기 (한글 조합 중 Enter는 무시)
  if (e.key === 'Enter' && !e.isComposing && e.target instanceof Element) {
    const box = e.target.closest('.new-cat');
    if (box) { e.preventDefault(); box.querySelector('[data-action=add-cat]').click(); }
    else if (e.target.id === 'custom-hex') { e.preventDefault(); const b = $('#custom-save'); if (b && !b.disabled) b.click(); else syncCustom(e.target.value, 'hex'); }
    else if (e.target.dataset.catId) { e.preventDefault(); e.target.blur(); }
  }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (ro()) return; // 읽기 전용: 보내는 폼 없음
  const f = e.target;
  const btn = f.querySelector('[type=submit]');
  if (f.id === 'login-form') {
    const err = $('#login-error'); err.textContent = '';
    const email = loginEmail(f.email.value), password = f.password.value;
    if (!email || !password) { err.textContent = LOGIN_ID_DOMAIN ? '아이디와 비밀번호를 입력해 주세요.' : '이메일과 비밀번호를 입력해 주세요.'; return; }
    await busy(btn, async () => {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { err.textContent = friendly(error); return; }
      state.user = data.user;
      state.roomId = null;
      forcePicker = true; // 방이 2개 이상이면 방 고르기 화면부터
      try { await refresh({ keepSheet: false }); } catch (x) { err.textContent = friendly(x); }
      if (pendingKey()) takePending(); // /r/<key>로 들어왔으면 그 공개 방
      else publicNotice();
    });
  }
  if (f.id === 'signup-form') {
    const err = $('#signup-error'); err.textContent = '';
    const input = signupInput(f);
    if (input.error) { err.textContent = input.error; return; }
    await busy(btn, async () => {
      let j;
      try { j = await signUp(input); } catch (x) {
        // 공개 방 코드: 서버가 계정을 만들기 전에 409 needAck → 동의 시트 (입력값은 폼에 그대로)
        if (x.body && x.body.needAck) { openAck('signup', { name: input.displayName, roomName: x.body.roomName, ackVersion: x.body.ackVersion }); return; }
        err.textContent = friendly(x); return;
      }
      await finishSignup(j);
    });
  }
  if (f.id === 'room-form') {
    // 방 만들기(방 이름 + 닉네임) 또는 코드로 참여(초대 코드 + 닉네임). 시작하기 화면과 '새 방' 시트가 같이 씀
    const err = f.querySelector('.error'); err.textContent = '';
    const create = f.dataset.mode === 'create';
    const roomName = create ? field(f, 'room').value.trim() : '';
    const code = create ? '' : field(f, 'code').value.toUpperCase().replace(/[\s-]/g, '');
    const name = field(f, 'name').value.trim();
    if (create && !roomName) { err.textContent = '방 이름을 입력해 주세요.'; return; }
    if (!create && !code) { err.textContent = '초대 코드를 입력해 주세요.'; return; }
    if (!name) { err.textContent = '닉네임을 입력해 주세요.'; return; }
    if (BAD_TEXT_RE.test(roomName) || BAD_TEXT_RE.test(name)) { err.textContent = BAD_TEXT_MSG; return; }
    // 공개 방 만들기 (§4.7): 소개 60자, '이해했어요' 체크, 닉네임이 내 아이디와 같으면 바로 알려 줌 (DB도 다시 확인)
    const pub = create && PUBLIC_ROOMS_ENABLED && !!f.querySelector('input[name=visibility][value=public]:checked');
    const description = pub && field(f, 'description') ? field(f, 'description').value.trim() : '';
    if (pub) {
      if ([...description].length > PUBLIC_DESC_MAX) { err.textContent = `소개는 ${PUBLIC_DESC_MAX}자까지 쓸 수 있어요.`; return; }
      if (BAD_TEXT_RE.test(description)) { err.textContent = BAD_TEXT_MSG; return; }
      if (!(field(f, 'ack') && field(f, 'ack').checked)) { err.textContent = '공개 방 안내를 읽고 ‘이해했어요’에 체크해 주세요.'; return; }
      const email = String((state.user && state.user.email) || '');
      const myId = loginId(email) || email.split('@')[0];
      if (myId && nickKey(name) === myId.toLowerCase()) { err.textContent = friendly(new Error('nickname_is_login_id')); return; }
    }
    await busy(btn, async () => {
      const { data, error } = pub
        ? await sb.rpc('create_room', { p_display_name: name, p_room_name: roomName, p_visibility: 'public', p_description: description, p_ack_version: PUBLIC_ACK_VERSION })
        : create
        ? await sb.rpc('create_couple', { p_display_name: name, p_couple_name: roomName })
        : SIGNUP_ENABLED ? await joinViaServer(code, name) // 친구용: 서버가 횟수를 세고 참여시킴
          : await sb.rpc('join_couple', { p_invite_code: code, p_display_name: name });
      if (error) {
        // 공개 방 코드: 서버가 409 needAck → 동의 시트 (동의하면 같은 요청을 ackVersion과 함께 다시 보냄)
        if (!create && error.body && error.body.needAck) { openAck('join', { code, name, roomName: error.body.roomName, ackVersion: error.body.ackVersion }); return; }
        if (pub) pubStatusAt = 0; // 한도에 걸렸으면 다음에 그릴 때 다시 확인
        err.textContent = friendly(error); return;
      }
      if (pub) pubStatusAt = 0;
      try { await switchRoom(typeof data === 'string' && data ? data : null); } catch (x) { toast(friendly(x)); return; }
      toast(pub ? '공개 방을 만들었어요.' : create ? '방을 만들었어요. 초대 코드를 보내 주세요.' : '방에 들어왔어요.');
    });
  }
  if (f.id === 'room-name-form') {
    const roomId = state.roomId, name = field(f, 'room').value.trim();
    if (!name) { toast('방 이름을 1~30자로 입력해 주세요.'); return; }
    if (BAD_TEXT_RE.test(name)) { toast(BAD_TEXT_MSG); return; }
    if (state.couple && name === state.couple.name) return;
    await busy(btn, async () => {
      const { error } = await sb.rpc('rename_room', { p_couple: roomId, p_name: name });
      if (error) { toast(friendly(error)); return; }
      try { await refresh(); } catch (x) { toast(friendly(x)); return; }
      if (state.sheet && state.sheet.type === 'settings') renderSheet();
      toast('방 이름을 바꿨어요.');
    });
  }
  if (f.id === 'place-form') {
    const err = $('#form-error'); err.textContent = '';
    // 저장하는 사이 뒤로 가기 등으로 화면이 바뀌었으면, 저장만 하고 화면은 그대로 둠 (누르지 않았는데 화면을 열지 않게)
    const sheet = state.sheet;
    const roomId = state.roomId, userId = uid();
    const sameContext = () => roomId && state.roomId === roomId && uid() === userId;
    const stillOpen = () => state.sheet === sheet;
    if (isShareText(f.naver_url.value)) applyShare(f, f.naver_url.value);
    // 구글 지도에서 이름·주소를 받는 중이면(아직 안 물어본 링크면 지금 물어서) 받은 다음에 저장
    fillFromGoogle(f);
    const job = googleJob && googleJob.form === f ? googleJob : null;
    if (job) await busy(btn, () => job.done);
    if (!sameContext()) { toast(friendly(new Error('save_context_changed'))); return; }
    const name = field(f, 'name').value.trim();
    if (!name) { err.textContent = '장소 이름을 입력해 주세요.'; field(f, 'name').focus(); return; }
    if (!f.category.value) { err.textContent = '카테고리를 골라 주세요.'; return; }
    const rawUrl = cleanUrl(f.naver_url.value.trim());
    const naver_url = rawUrl ? safeUrl(rawUrl) : null;
    if (rawUrl && !naver_url) { err.textContent = '링크 형식이 올바르지 않아요.'; return; }
    const fields = { name, address: f.address.value.trim() || null, category: f.category.value, naver_url };
    await busy(btn, async () => {
      if (sheet.type === 'edit') {
        const { error } = await sb.from('places').update(fields).eq('couple_id', roomId).eq('id', sheet.id);
        if (error) { if (stillOpen()) err.textContent = friendly(error); else toast(friendly(error)); return; }
        await refresh({ keepSheet: !stillOpen() });
        if (stillOpen()) openSheet('detail', sheet.id);
        toast('변경 내용을 저장했어요.');
      } else {
        const duplicate = state.places.find((p) => placeKey(p.name) === placeKey(name) && placeKey(p.address) === placeKey(fields.address));
        if (duplicate && !confirm(`이 방에 이름과 주소가 같은 ‘${duplicate.name}’ 장소가 있어요. 그래도 새로 추가할까요?`)) return;
        if (!sameContext()) { toast(friendly(new Error('save_context_changed'))); return; }
        const { data, error } = await sb.from('places').insert({
          ...fields, status: f.status.value, shared_note: f.shared_note.value.trim(),
          couple_id: roomId, created_by: userId,
        }).select('id').single();
        if (error) { if (stillOpen()) err.textContent = friendly(error); else toast(friendly(error)); return; }
        const files = f.photo.files;
        const r = files.length ? await addPhotos({ id: data.id, photos: [] }, files, (k, n) => { btn.textContent = `사진 올리는 중 ${k}/${n}`; }) : null;
        if (sameContext()) state.tab = f.status.value;
        await refresh({ keepSheet: !stillOpen() });
        dropAddForm();
        if (stillOpen()) openSheet('detail', data.id);
        toast(r && (r.error || r.skipped) ? `장소를 추가했어요. ${photoResultText(r)}` : '장소를 추가했어요.', r && (r.error || r.skipped) ? 6000 : 2200);
      }
    });
  }
  if (f.id === 'room-desc-form') {
    const roomId = state.roomId, description = field(f, 'description').value.trim();
    if ([...description].length > PUBLIC_DESC_MAX) { toast(`소개는 ${PUBLIC_DESC_MAX}자까지 쓸 수 있어요.`); return; }
    if (BAD_TEXT_RE.test(description)) { toast(BAD_TEXT_MSG); return; }
    if (state.couple && description === (state.couple.description || '')) return;
    await busy(btn, async () => {
      const { error } = await sb.rpc('set_room_description', { p_couple: roomId, p_description: description });
      if (error) { toast(friendly(error)); return; }
      try { await refresh(); } catch (x) { toast(friendly(x)); return; }
      if (state.sheet && state.sheet.type === 'settings') renderSheet();
      toast(description ? '소개를 저장했어요.' : '소개를 지웠어요.');
    });
  }
  if (f.id === 'name-form') {
    const name = field(f, 'name').value.trim();
    if (!name) return;
    if (BAD_TEXT_RE.test(name)) { toast(BAD_TEXT_MSG); return; }
    await busy(btn, async () => {
      // 닉네임은 방마다 따로: 지금 방의 내 줄만 바꿈 (방 조건이 없으면 내가 든 모든 방이 바뀜)
      const { error } = await sb.from('couple_members').update({ display_name: name }).eq('couple_id', state.roomId).eq('user_id', uid());
      if (error) { toast(friendly(error)); return; }
      try { await refresh(); } catch (x) { toast(friendly(x)); return; }
      if (state.sheet && state.sheet.type === 'settings') renderSheet();
      toast('닉네임을 바꿨어요.');
    });
  }
  if (f.id === 'pw-form') {
    const err = $('#pw-error'); err.textContent = '';
    if (f.pw.value.length < 8) { err.textContent = '8자 이상 입력해 주세요.'; return; }
    if (f.pw.value !== f.pw2.value) { err.textContent = '두 비밀번호가 달라요.'; return; }
    await busy(btn, async () => {
      const { error } = await sb.auth.updateUser({ password: f.pw.value });
      if (error) { err.textContent = friendly(error); return; }
      f.reset(); toast('비밀번호를 바꿨어요.');
    });
  }
});

// 다른 앱에 갔다 돌아오면 다른 멤버가 바꾼 내용을 다시 불러옴
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { keepNoteDraft(); keepReviewDraft(); keepAddForm(); flushDrafts(); }
  // 공개 방을 둘러보는 중이면 그 방 JSON만 다시 받음 (내 방 불러오기 대신)
  // 지도 앱에 다녀올 때마다 받지 않게, 마지막으로 받은 지 5분이 지났을 때만 (서버가 사진 한도를 세므로)
  if (document.visibilityState === 'visible' && state.authRetry) bootSession().catch(() => {});
  if (document.visibilityState === 'visible' && state.user && state.visit) {
    if (state.visit.status === 'ok' && Date.now() - (state.visit.loadedAt || 0) > 5 * 60e3) loadVisit(true);
  }
  else if (document.visibilityState === 'visible' && state.user && state.roomId) refresh().catch(() => {});
  if (document.visibilityState === 'visible' && $('#place-form')) warmGoogle(); // 구글 지도에서 링크를 복사해 돌아온 참
});

window.addEventListener('pagehide', () => { keepNoteDraft(); keepReviewDraft(); keepAddForm(); flushDrafts(); });

const isNetErr = (e) => !!e && (e.name === 'AuthRetryableFetchError' || e.status === 0 || /Failed to fetch|NetworkError|Load failed/i.test(e.message || ''));
async function bootSession() {
  let data, error;
  try { ({ data, error } = await sb.auth.getSession()); }
  catch { state.authRetry = true; state.loadError = true; render(); return; }
  if (!data.session && isNetErr(error)) { state.authRetry = true; state.loadError = true; render(); return; }
  state.authRetry = false;
  state.user = data.session ? data.session.user : null;
  if (state.user) { try { await loadAll(); state.loadError = false; } catch (err) { state.loadError = true; toast(friendly(err)); } }
  render();
}
window.addEventListener('online', () => { if (state.authRetry) bootSession().catch(() => {}); else if (state.user && state.loadError) refresh().catch(() => {}); });

/* ---------- 시작 ---------- */
(async function start() {
  sharedText = takeShare(); cleanDrafts();
  // 화면을 연 채로 새로고침했으면 그때 쌓였던 기록 위치에서 맨 처음 자리로 돌아감 (새로고침하면 화면은 닫혀 있으니까)
  if (history.state && history.state.ourPlaces) { skipPops++; history.go(-history.state.ourPlaces); }
  // 공개 방 보기 링크 /r/<key>: 키는 이 탭의 sessionStorage에 두고 주소는 '/'로 (로그인하고 첫 불러오기가 끝나면 엶, §4.12)
  else {
    const m = /^\/r\/([a-km-np-z2-9]{10})$/.exec(location.pathname);
    if (m) {
      try { sessionStorage.setItem(PENDING_KEY, m[1]); } catch { /* 못 남기면 로그인 뒤 열리지 않을 뿐 */ }
      try { history.replaceState(null, '', '/'); } catch { /* 주소만 그대로 남음 */ }
    }
  }
  if (!configured) { render(); return; }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      if (uid()) dropDrafts(`${DRAFT}${uid()}:`); dropAddForm();
      state.authRetry = false;
      loadGen++; // 로그아웃 전에 시작한 불러오기는 버림
      Object.assign(state, {
        user: null, rooms: [], allMembers: [], roomsLoaded: false, roomId: null, couple: null, members: [], loadedRoom: null, loadError: false,
        places: [], categories: [], sheet: null, cup: null, cupSetup: null, cupResults: [], cupTab: 'new', query: '', category: '전체',
        explore: null, visit: null,
      });
      pubStatus = null; pubStatusAt = 0;
      visitLarge.clear();
      forcePicker = false;
      onboardMode = 'create';
      authMode = 'login';
      $('#viewer-root').innerHTML = ''; // 사진 크게 보기도 같이 닫음
      renderSheet(); render();
    } else if (session) {
      state.user = session.user;
    }
  });
  await bootSession();
  if (state.user && pendingKey()) takePending(); // 로그인한 채로 /r/<key>를 열었으면 그 공개 방
  else if (state.user) publicNotice();
})();
</script>
