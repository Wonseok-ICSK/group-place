}
/* ---------- 뒤로 가기 (안드로이드 뒤로 버튼, 브라우저 뒤로) ----------
   층(시트 → 정보 수정 → 사진 크게 보기)이 열릴 때마다 방문 기록을 하나씩 쌓아서, 뒤로 가기는 맨 위 층만 닫음.
   다 닫힌 상태에서 누르면 앱을 떠남.
   ✕·저장·삭제처럼 앱이 직접 닫을 때는 쌓아 둔 기록도 같이 되돌림 (그때 오는 popstate는 무시).
   기록은 화면을 누른 그 순간에만 쌓음: 누르지 않았는데 쌓으면 크롬이 그 기록을 건너뛰어 앱이 바로 꺼질 수 있음 */
const layers = [];         // 기록을 쌓아 둔 층: 'sheet' | 'edit' | 'viewer'
let skipPops = 0;          // 앱이 직접 되돌린 횟수만큼 popstate 무시
let closingByBack = false; // 뒤로 가기로 닫는 중 (이때는 기록을 건드리지 않음)
function wantedLayers() {
  const want = [];
  if (state.sheet) { want.push('sheet'); if (state.sheet.type === 'edit') want.push('edit'); }
  if ($('#viewer-root').innerHTML) want.push('viewer');
  return want;
}
// 화면을 열거나 닫은 뒤 부름: 열린 층 수와 쌓인 기록 수를 맞춤 (push: false면 지우기만)
function syncHistory({ push = true } = {}) {
  if (closingByBack) return;
  const want = wantedLayers();
  let same = 0;
  while (same < layers.length && same < want.length && layers[same] === want[same]) same++;
  if (layers.length > same) { // 닫힌 층의 기록부터 되돌림 (새로 쌓을 층이 있으면 되돌린 뒤에)
    const n = layers.length - same;
    layers.length = same;
    skipPops++;
    history.go(-n);
    return;
  }
  // 되돌리는 중이면(앞에서 history.go를 부르고 아직 popstate가 안 옴) 그 popstate가 온 뒤에 쌓음. 순서가 꼬이지 않게
  if (push && !skipPops) for (const kind of want.slice(same)) { layers.push(kind); history.pushState({ ourPlaces: layers.length }, ''); }
}
window.addEventListener('popstate', () => {
  if (skipPops) { skipPops--; syncHistory(); return; }
  const depth = (history.state && history.state.ourPlaces) || 0;
  closingByBack = true;
  try {
    while (layers.length > depth) {
      const kind = layers.pop();
      if (kind === 'viewer') closeViewer();
      else if (kind === 'edit') { if (state.sheet && state.sheet.type === 'edit') openSheet('detail', state.sheet.id); }
      else closeSheet(); // 하던 월드컵은 지우지 않음 → 트로피를 다시 누르면 이어서
    }
  } finally { closingByBack = false; }
  // 앞으로 가기로 기록만 앞서 나가면 다시 되돌림 (닫힌 화면을 기록만으로 다시 열지는 않음)
  if (depth > layers.length) { skipPops++; history.go(layers.length - depth); return; }
  // 닫다가 다른 층도 같이 닫혔으면(예: 상대가 지운 장소) 남은 기록도 맞춤. 여기선 누른 게 아니라서 새로 쌓지는 않음
  syncHistory({ push: false });
});
function renderSheet() {
  drawSheet();
  syncHistory();
}
function drawSheet() {
  const root = $('#sheet-root');
  const s = state.sheet;
  if (!s) { root.innerHTML = ''; root.dataset.view = ''; document.body.style.overflow = ''; return; }
  let inner = '';
  if (s.type === 'add') inner = placeForm(null);
  else if (s.type === 'edit') inner = placeForm(state.places.find((x) => x.id === s.id));
  else if (s.type === 'settings') inner = settingsView();
  else if (s.type === 'cup') inner = state.cup ? cupView() : state.cupTab === 'records' ? cupRecordsView() : cupSetupView();
  else if (s.type === 'detail') {
    const p = state.places.find((x) => x.id === s.id);
    if (!p) { closeSheet(); toast('삭제된 장소예요.'); return; }
    // 입력 중인 글이 새로고침으로 날아가지 않게 보존
    const same = root.dataset.view === `detail:${p.id}`;
    // 후기 입력칸은 같은 방문을 계속 편집 중일 때만 되살림
    const sameEdit = same && root.dataset.edit === String(state.editVisit);
    const note = same && $('#shared-note'), review = sameEdit && $('#my-review'), day = sameEdit && $('#visit-date');
    const edited = (el) => (el && el.value !== el.defaultValue ? el.value : null);
    const keep = { note: edited(note), review: edited(review), day: edited(day), scroll: same ? $('.sheet-body', root).scrollTop : 0 };
    mountSheet(detailView(p), `detail:${p.id}`);
    root.dataset.edit = String(state.editVisit);
    if (keep.note != null && $('#shared-note')) $('#shared-note').value = keep.note;
    if (keep.review != null && $('#my-review')) $('#my-review').value = keep.review;
    if (keep.day != null && $('#visit-date')) $('#visit-date').value = keep.day;
    if (keep.scroll) $('.sheet-body', root).scrollTop = keep.scroll;
    showGallery(state.photoIdx); // 다시 그려도 보던 사진 그대로
    return;
  }
  mountSheet(inner, s.type);
}
function mountSheet(inner, key) {
  const root = $('#sheet-root');
  root.dataset.view = key;
  const open = $('.sheet', root);
  if (open) open.innerHTML = inner;
  else root.innerHTML = `<div class="sheet-backdrop" data-action="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${inner}</section>`;
  document.body.style.overflow = 'hidden';
  markStampsSeen();
}
// 방문의 내 후기 입력칸 열기 ('new' = 새 방문, null = 닫기)
function editVisit(p, id) {
  const v = p.visits.find((x) => x.id === id);
  const mine = v && v.reviews.find((r) => r.author_id === uid());
  state.editVisit = id;
  state.draftRating = mine && mine.rating ? mine.rating : 0;
  renderSheet();
}
function closeSheet() {
  cancelGoogle();
  state.sheet = null;
  $('#viewer-root').innerHTML = '';
  renderSheet();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const placeId = state.sheet && state.sheet.id;
  const p = placeId && state.places.find((x) => x.id === placeId);
  try {
    switch (a) {
      case 'onboard-mode': onboardMode = el.dataset.mode; render(); break;
      case 'auth-mode': authMode = el.dataset.mode; render(); window.scrollTo(0, 0); break;
      case 'logout': await sb.auth.signOut(); break;
      case 'tab': state.tab = el.dataset.tab; render(); break;
      case 'cat': state.category = el.dataset.cat; render(); break;
      case 'sort': state.sort = el.dataset.sort; render(); break;
      case 'open': openSheet('detail', el.dataset.id); break;
      case 'add': openSheet('add'); break;
      case 'settings': openSheet('settings'); break;
      case 'close': {
        const s = state.sheet;
        if (s && s.type === 'edit') { openSheet('detail', s.id); break; }
        // 월드컵을 하던 중이면 한 번 물어봄. ✕로 닫으면 그만두는 것 (뒤로 가기로 닫으면 이어서 할 수 있게 남겨 둠)
        if (s && s.type === 'cup' && state.cup && !state.cup.champion && state.cup.history.length && !confirm('월드컵을 그만할까요? 지금까지 고른 건 사라져요.')) break;
        if (s && s.type === 'cup') state.cup = null;
        closeSheet();
        break;
      }
      case 'cup': {
        // 뒤로 가기로 잠깐 닫았던 월드컵이 아직 안 끝났으면 이어서
        if (state.cup && !state.cup.champion) { openSheet('cup'); toast('하던 월드컵을 이어서 해요.'); break; }
        state.cup = null;
        state.cupTab = 'new';
        const s = state.cupSetup;
        if (!s || (s.year !== 'all' && !cupYears().includes(s.year))) state.cupSetup = { year: cupYears()[0] || 'all', cat: '전체', mode: 'seed' };
        else if (s.cat !== '전체' && !catNames().includes(s.cat)) s.cat = '전체';
        openSheet('cup');
        break;
      }
      case 'cup-year':
        state.cupSetup.year = el.dataset.year;
        if (!cupPool(state.cupSetup.year, state.cupSetup.cat).length) state.cupSetup.cat = '전체';
        renderSheet(); break;
      case 'cup-cat': state.cupSetup.cat = el.dataset.cat; renderSheet(); break;
      case 'cup-mode': state.cupSetup.mode = el.dataset.mode; renderSheet(); break;
      case 'cup-start': startCup(); renderSheet(); break;
      case 'cup-pick':
        if (state.cup.champion) break; // 결승을 두 번 눌러도 한 번만
        pickCup(el.dataset.id); renderSheet();
        if (state.cup.champion) await saveCup();
        break;
      case 'cup-save': state.cup.saved = 'saving'; renderSheet(); await saveCup(); break;
      case 'cup-undo': undoCup(); renderSheet(); break;
      case 'cup-again': state.cup = null; state.cupTab = 'new'; renderSheet(); break;
      case 'cup-records': state.cup = null; state.cupTab = 'records'; renderSheet(); break;
      case 'cup-tab': state.cupTab = el.dataset.tab; renderSheet(); break;
      case 'cup-play': {
        // 역대 기록에서 '나도 하기': 상대가 한 월드컵과 같은 조건으로
        const { year, cat } = el.dataset;
        if (year !== 'all' && !cupYears().includes(year)) { toast(`${year}년 방문 기록이 이제 없어요.`); break; }
        state.cupSetup = { ...state.cupSetup, year, cat: cat === '전체' || catNames().includes(cat) ? cat : '전체' };
        state.cupTab = 'new'; renderSheet();
        break;
      }
      case 'cup-del': await deleteCupResult(el.dataset.id); break;
      case 'new-cat': {
        const box = el.closest('form').querySelector('.new-cat');
        box.classList.remove('hidden');
        box.querySelector('input').focus();
        break;
      }
      case 'add-cat': await busy(el, () => addCategory(el)); break;
      case 'cat-move': await moveCategory(el.dataset.id, Number(el.dataset.dir)); break;
      case 'cat-delete': await deleteCategory(el.dataset.id); break;
      case 'edit': openSheet('edit', placeId); break;
      case 'copy-code':
        try { await navigator.clipboard.writeText(state.couple.invite_code); toast('초대 코드를 복사했어요.'); }
        catch { toast(`코드: ${state.couple.invite_code}`); }
        break;
      case 'pick-cat': selectCat(el.closest('form'), el.dataset.cat); break;
      case 'pick-status': {
        const form = el.closest('form');
        form.status.value = el.dataset.status;
        form.querySelectorAll('[data-action=pick-status]').forEach((b) => b.setAttribute('aria-pressed', b === el));
        break;
      }
      case 'toggle-fav': {
        const next = !p.favorite;
        const { error } = await sb.from('places').update({ favorite: next }).eq('id', p.id);
        if (error) throw error;
        p.favorite = next; render(); renderSheet();
        toast(next ? '찜했어요.' : '찜을 해제했어요.');
        break;
      }
      case 'set-status': {
        const next = el.dataset.status;
        if (p.status === next) break;
        const { error } = await sb.from('places').update({ status: next }).eq('id', p.id);
        if (error) throw error;
        p.status = next; render(); renderSheet();
        toast(next === 'visited' ? '다녀온 곳으로 옮겼어요.' : '가고 싶은 곳으로 옮겼어요.');
        break;
      }
      case 'save-note': await busy(el, async () => {
        const { error } = await sb.from('places').update({ shared_note: $('#shared-note').value.trim() }).eq('id', p.id);
        if (error) throw error;
        await refresh(); toast('메모를 저장했어요.');
      }); break;
      case 'rate': {
        const n = Number(el.dataset.n);
        state.draftRating = state.draftRating === n ? 0 : n;
        const group = el.closest('.rate-input');
        group.querySelectorAll('.rs').forEach((s, k) => { s.className = `rs ${starCls(state.draftRating, k + 1)}`; });
        group.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', Number(b.dataset.n) === state.draftRating));
        break;
      }
      case 'add-visit': editVisit(p, 'new'); break;
      case 'edit-visit': editVisit(p, el.dataset.visit); break;
      case 'cancel-visit': editVisit(p, null); break;
      case 'save-visit': await busy(el, async () => {
        const day = $('#visit-date').value;
        if (!day) { toast('방문 날짜를 골라 주세요.'); return; }
        const body = $('#my-review').value.trim();
        const rating = state.draftRating || null;
        // 새 방문인데 그 날짜 방문이 이미 있으면(상대가 먼저 남김) 거기에 내 후기를 붙임
        let v = p.visits.find((x) => x.id === state.editVisit) || p.visits.find((x) => x.visited_on === day);
        if (!v) {
          const { data, error } = await sb.from('visits').insert({ place_id: p.id, visited_on: day, created_by: uid() }).select().single();
          if (error) throw error;
          v = { ...data, reviews: [] };
        } else if (v.visited_on !== day) {
          const { error } = await sb.from('visits').update({ visited_on: day }).eq('id', v.id);
          if (error) throw error;
        }
        // 별점과 글을 모두 비우고 저장하면 내 후기는 지움 (방문 날짜만 남음)
        const mine = v.reviews.find((r) => r.author_id === uid());
        const { error } = rating || body
          ? mine
            ? await sb.from('reviews').update({ rating, body }).eq('id', mine.id)
            : await sb.from('reviews').insert({ place_id: p.id, visit_id: v.id, author_id: uid(), rating, body })
          : mine ? await sb.from('reviews').delete().eq('id', mine.id) : { error: null };
        if (error) throw error;
        state.editVisit = null; state.draftRating = 0;
        await refresh(); toast('방문 기록을 저장했어요.');
      }); break;
      case 'delete-review': {
        const v = p.visits.find((x) => x.id === state.editVisit);
        const mine = v && v.reviews.find((r) => r.author_id === uid());
        if (!mine || !confirm('이 방문의 내 후기를 삭제할까요?')) break;
        const { error } = await sb.from('reviews').delete().eq('id', mine.id);
        if (error) throw error;
        state.editVisit = null; state.draftRating = 0;
        await refresh(); toast('후기를 삭제했어요.');
        break;
      }
      case 'delete-visit': {
        const v = p.visits.find((x) => x.id === state.editVisit);
        if (!v || !confirm(`${fmtDay(v.visited_on)} 방문 기록을 삭제할까요?${v.reviews.length ? ' 내 후기도 함께 지워져요.' : ''}`)) break;
        // 상대 후기가 그새 달렸으면 DB가 막아서 지워진 행이 없음
        const { data, error } = await sb.from('visits').delete().eq('id', v.id).select('id');
        if (error) throw error;
        state.editVisit = null; state.draftRating = 0;
        await refresh();
        toast(data.length ? '방문 기록을 삭제했어요.' : '상대 후기가 있는 방문은 지울 수 없어요.');
        break;
      }
      case 'delete-place': {
        if (!confirm(`${josa(p.name, '을', '를')} 삭제할까요? 방문 기록과 두 사람의 후기도 함께 지워져요.`)) break;
        // 사진 권한은 장소 존재 여부로 확인하므로 장소보다 먼저 지움 (사진 표 줄은 장소와 같이 지워짐)
        if (p.photos.length) await sb.storage.from(BUCKET).remove(p.photos.map((x) => x.path));
        const sheet = state.sheet;
        const { error } = await sb.from('places').delete().eq('id', p.id);
        if (error) throw error;
        if (state.sheet === sheet) { state.sheet = null; renderSheet(); } // 그사이 다른 화면을 열었으면 그건 두고
        await refresh(); toast('장소를 삭제했어요.');
        break;
      }
      case 'remove-photo': {
        const i = galleryIndex(), ph = p.photos[i];
        if (!ph) break;
        const ask = p.photos.length === 1 ? '사진을 삭제할까요?' : i === 0 ? '대표 사진을 삭제할까요? 다음 사진이 대표 사진이 돼요.' : '이 사진을 삭제할까요?';
        if (!confirm(ask)) break;
        await deletePhoto(ph);
        state.photoIdx = Math.max(0, Math.min(i, p.photos.length - 2)); // 지운 자리의 다음(마지막이면 앞) 사진
        await refresh(); toast('사진을 삭제했어요.');
        break;
      }
      case 'photo-cover': {
        const ph = p.photos[galleryIndex()];
        if (!ph) break;
        await setCover(p, ph);
        state.photoIdx = 0;
        await refresh(); toast('대표 사진으로 바꿨어요. 목록에도 이 사진이 보여요.');
        break;
      }
      case 'view-photo': openViewer(p, Number(el.dataset.i)); break;
      case 'close-viewer': closeViewer(); break;
    }
  } catch (err) {
    toast(friendly(err));
  }
});

// 사진을 옆으로 밀 때 번호 맞추기 (scroll은 버블링이 안 돼서 capture로 받음)
document.addEventListener('scroll', (e) => {

  // 휴대폰 키보드의 클립보드 버튼은 paste 이벤트 없이 글자를 넣으므로 여기서도 정리

    if (googleJob && googleJob.form === form && googleKey(v) !== googleJob.url) cancelGoogle(); // 묻는 중에 링크를 바꿈
    if (isShareText(v)) applyShare(form, v);
    // 링크만 붙여넣은 구글 지도 링크: 손으로 치는 중에 묻지 않게 잠깐 기다렸다가
    else if (isGoogleMaps(v.trim())) {
      clearTimeout(googleTimer);
      googleTimer = setTimeout(() => fillFromGoogle(form), 400);
    }
  }
});

document.addEventListener('paste', (e) => {
  const form = e.target.form;
  if (!form || form.id !== 'place-form' || !['naver_url', 'name', 'address'].includes(e.target.name)) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!isShareText(text)) return; // 링크만, 혹은 일반 글자만 붙여넣은 경우는 그대로
  e.preventDefault();
  if (!applyShare(form, text)) toast('링크와 이름·주소를 채웠어요.'); // 구글 지도는 알림을 따로 띄움
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.name === 'photo' && t.form && t.form.id === 'place-form') {
    // 고른 사진 미리보기 (최대 장수까지, 첫 장에 '대표')
    const box = $('#photo-previews');
    box.querySelectorAll('img').forEach((img) => URL.revokeObjectURL(img.src));
    const files = [...t.files];
    box.innerHTML = files.slice(0, MAX_PHOTOS).map((f, i) => `<span class="photo-preview"><img src="${URL.createObjectURL(f)}" alt="고른 사진 ${i + 1}">${i ? '' : '<span class="cover-badge">대표</span>'}</span>`).join('');
    $('#photo-hint').textContent = files.length > MAX_PHOTOS
      ? `사진은 ${MAX_PHOTOS}장까지라 ${files.length - MAX_PHOTOS}장은 빠져요.`
      : `처음 고른 사진이 대표 사진이에요. 최대 ${MAX_PHOTOS}장.`;
  }
  if (t.dataset.catId) {
    try { await renameCategory(t); } catch (err) { toast(friendly(err)); }
  }
  if (t.id === 'photo-input' && t.files.length) {
    const p = state.sheet && state.places.find((x) => x.id === state.sheet.id);
    if (!p) return;
    const before = p.photos.length;
    const r = await addPhotos(p, t.files, (k, n) => toast(n > 1 ? `사진을 올리는 중… (${k}/${n})` : '사진을 올리는 중…', 0));
    if (r.done) state.photoIdx = before; // 새로 올린 첫 사진을 보여 줌
    try { await refresh(); } catch (err) { toast(friendly(err)); return; }
    toast(photoResultText(r), r.error || r.skipped ? 6000 : 2200);
  }
});

document.addEventListener('keydown', (e) => {
  // Esc: 크게 보던 사진이 있으면 그것만 닫음
  if (e.key === 'Escape' && closeViewer()) { e.preventDefault(); return; }
  if (e.key === 'Escape' && state.sheet) { e.preventDefault(); $('[data-action=close]', $('#sheet-root')).click(); }
  // 카테고리 입력칸의 Enter는 장소 폼 제출 대신 추가 / 이름 바꾸기 (한글 조합 중 Enter는 무시)
  if (e.key === 'Enter' && !e.isComposing && e.target instanceof Element) {
    const box = e.target.closest('.new-cat');
    if (box) { e.preventDefault(); box.querySelector('[data-action=add-cat]').click(); }
    else if (e.target.dataset.catId) { e.preventDefault(); e.target.blur(); }
  }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('[type=submit]');
  if (f.id === 'login-form') {
    const err = $('#login-error'); err.textContent = '';
    const email = loginEmail(f.email.value), password = f.password.value;
    if (!email || !password) { err.textContent = LOGIN_ID_DOMAIN ? '아이디와 비밀번호를 입력해 주세요.' : '이메일과 비밀번호를 입력해 주세요.'; return; }
    await busy(btn, async () => {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { err.textContent = friendly(error); return; }
      state.user = data.user;
      try { await refresh({ keepSheet: false }); } catch (x) { err.textContent = friendly(x); }
    });
  }
  if (f.id === 'signup-form') {
    const err = $('#signup-error'); err.textContent = '';
    const input = signupInput(f);
    if (input.error) { err.textContent = input.error; return; }
    await busy(btn, async () => {
      let j;
      try { j = await signUp(input); } catch (x) { err.textContent = friendly(x); return; }
      // 서버가 가입한 사람으로 로그인해서 받은 토큰을 그대로 씀 (로그인을 한 번 더 하지 않게)
      const { data, error } = await sb.auth.setSession({ access_token: j.access_token, refresh_token: j.refresh_token });
      if (error || !data.user) { authMode = 'login'; render(); $('#login-error').textContent = '가입했어요. 아이디와 비밀번호로 로그인해 주세요.'; return; }
      state.user = data.user;
      authMode = 'login';
      try { await refresh({ keepSheet: false }); } catch (x) { render(); toast(friendly(x)); return; }
      toast(j.joined ? '가입했어요. 공간에 들어왔어요.' : '가입했어요. 이제 둘만의 공간을 만들어요.');
    });
  }
  if (f.id === 'onboard-form') {
    const err = $('#onboard-error'); err.textContent = '';
    const name = field(f, 'name').value.trim();
    if (!name) { err.textContent = '이름을 입력해 주세요.'; return; }
    await busy(btn, async () => {
      const { error } = onboardMode === 'create'
        ? await sb.rpc('create_couple', { p_display_name: name })
        : SIGNUP_ENABLED ? await joinViaServer(f.code.value, name) // 친구용: 서버가 횟수를 세고 참여시킴
          : await sb.rpc('join_couple', { p_invite_code: f.code.value, p_display_name: name });
      if (error) { err.textContent = friendly(error); return; }
      await refresh({ keepSheet: false });
      toast(onboardMode === 'create' ? '공간을 만들었어요. 초대 코드를 보내 주세요.' : '공간에 참여했어요.');
    });
  }
  if (f.id === 'place-form') {
    const err = $('#form-error'); err.textContent = '';
    // 저장하는 사이 뒤로 가기 등으로 화면이 바뀌었으면, 저장만 하고 화면은 그대로 둠 (누르지 않았는데 화면을 열지 않게)
    const sheet = state.sheet;
    const stillOpen = () => state.sheet === sheet;
    if (isShareText(f.naver_url.value)) applyShare(f, f.naver_url.value);
    // 구글 지도에서 이름·주소를 받는 중이면(아직 안 물어본 링크면 지금 물어서) 받은 다음에 저장
    fillFromGoogle(f);
    const job = googleJob && googleJob.form === f ? googleJob : null;
    if (job) await busy(btn, () => job.done);
    const name = field(f, 'name').value.trim();
    if (!name) { err.textContent = '장소 이름을 입력해 주세요.'; field(f, 'name').focus(); return; }
    if (!f.category.value) { err.textContent = '카테고리를 골라 주세요.'; return; }
    const rawUrl = cleanUrl(f.naver_url.value.trim());
    const naver_url = rawUrl ? safeUrl(rawUrl) : null;
    if (rawUrl && !naver_url) { err.textContent = '링크 형식이 올바르지 않아요.'; return; }
    const fields = { name, address: f.address.value.trim() || null, category: f.category.value, naver_url };
    await busy(btn, async () => {
      if (sheet.type === 'edit') {
        const { error } = await sb.from('places').update(fields).eq('id', sheet.id);
        if (error) { if (stillOpen()) err.textContent = friendly(error); else toast(friendly(error)); return; }
        await refresh({ keepSheet: !stillOpen() });
        if (stillOpen()) openSheet('detail', sheet.id);
        toast('변경 내용을 저장했어요.');
      } else {
        const { data, error } = await sb.from('places').insert({
          ...fields, status: f.status.value, shared_note: f.shared_note.value.trim(),
          couple_id: state.couple.id, created_by: uid(),
        }).select('id').single();
        if (error) { if (stillOpen()) err.textContent = friendly(error); else toast(friendly(error)); return; }
        const files = f.photo.files;
        const r = files.length ? await addPhotos({ id: data.id, photos: [] }, files, (k, n) => { btn.textContent = `사진 올리는 중 ${k}/${n}`; }) : null;
        state.tab = f.status.value;
        await refresh({ keepSheet: !stillOpen() });
        if (stillOpen()) openSheet('detail', data.id);
        toast(r && (r.error || r.skipped) ? `장소를 추가했어요. ${photoResultText(r)}` : '장소를 추가했어요.', r && (r.error || r.skipped) ? 6000 : 2200);
      }
    });
  }
  if (f.id === 'name-form') {
    const name = field(f, 'name').value.trim();
    if (!name) return;
    await busy(btn, async () => {
      const { error } = await sb.from('couple_members').update({ display_name: name }).eq('user_id', uid());
      if (error) { toast(friendly(error)); return; }
      await refresh(); toast('이름을 바꿨어요.');
    });
  }
  if (f.id === 'pw-form') {
    const err = $('#pw-error'); err.textContent = '';
    if (f.pw.value.length < 8) { err.textContent = '8자 이상 입력해 주세요.'; return; }
    if (f.pw.value !== f.pw2.value) { err.textContent = '두 비밀번호가 달라요.'; return; }
    await busy(btn, async () => {
      const { error } = await sb.auth.updateUser({ password: f.pw.value });
      if (error) { err.textContent = friendly(error); return; }
      f.reset(); toast('비밀번호를 바꿨어요.');
    });
  }
});

// 다른 앱에 갔다 돌아오면 상대가 바꾼 내용을 다시 불러옴
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.user && state.couple) refresh().catch(() => {});
});

/* ---------- 시작 ---------- */
(async function start() {
  // 화면을 연 채로 새로고침했으면 그때 쌓였던 기록 위치에서 맨 처음 자리로 돌아감 (새로고침하면 화면은 닫혀 있으니까)
  if (history.state && history.state.ourPlaces) { skipPops++; history.go(-history.state.ourPlaces); }
  if (!configured) { render(); return; }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      Object.assign(state, { user: null, couple: null, members: [], places: [], categories: [], sheet: null, cup: null, cupResults: [], cupTab: 'new' });
      onboardMode = 'create';
      authMode = 'login';
      $('#viewer-root').innerHTML = ''; // 사진 크게 보기도 같이 닫음
      renderSheet(); render();
    } else if (session) {
      state.user = session.user;
    }
  });
  const { data } = await sb.auth.getSession();
  state.user = data.session ? data.session.user : null;
  if (state.user) {
    try { await loadAll(); } catch (err) { toast(friendly(err)); }
  }
  render();
})();
</script>
</body>
</html>
